<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a140a">
  <title>AirCommand</title>
  <style>
:root {
  --bg:           #090e09;
  --bg-panel:     #0d170d;
  --bg-card:      #111e11;
  --bg-card2:     #172217;
  --accent:       #4ade80;
  --accent-dim:   #22c55e;
  --accent-dark:  #16a34a;
  --warn:         #facc15;
  --warn-dim:     #ca8a04;
  --danger:       #ef4444;
  --purple:       #a78bfa;
  --text:         #d1fae5;
  --text-muted:   #5a7060;
  --border:       #1e3020;
  --border-hi:    #2d4830;
  --radius:       8px;
  --radius-lg:    12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Layout ──────────────────────────────────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  padding-top:    env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left:   env(safe-area-inset-left);
  padding-right:  env(safe-area-inset-right);
}

/* ── Tab bar ─────────────────────────────────────────────────────────────────── */
#tab-bar {
  display: flex;
  background: #050c05;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

#tab-bar button {
  flex: 1;
  padding: 10px 4px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  min-height: 44px;
}

#tab-bar button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  text-shadow: 0 0 8px rgba(74,222,128,0.4);
}

/* ── Stats bar ───────────────────────────────────────────────────────────────── */
#stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 14px;
  background: linear-gradient(180deg, #060d06, #090f09);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 44px;
  gap: 8px;
}

.stat-block { display: flex; flex-direction: column; }
.stat-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.stat-credits {
  font-size: 22px;
  font-weight: bold;
  color: var(--accent);
  letter-spacing: 0.5px;
  line-height: 1.1;
  text-shadow: 0 0 12px rgba(74,222,128,0.35);
}
.stat-rate {
  font-size: 12px;
  color: var(--accent-dim);
  letter-spacing: 0.3px;
}

#crate-badge {
  background: var(--bg-card);
  border: 1px solid var(--border-hi);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  padding: 4px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 36px;
  flex-shrink: 0;
}

#crate-badge.has-crates {
  border-color: var(--warn);
  color: var(--warn);
  box-shadow: 0 0 10px rgba(250,204,21,0.3);
  animation: pulseBadge 1.5s ease-in-out infinite;
}

@keyframes pulseBadge {
  0%,100% { box-shadow: 0 0 6px rgba(250,204,21,0.3); }
  50%      { box-shadow: 0 0 18px rgba(250,204,21,0.55); }
}

/* ── Boost bar ───────────────────────────────────────────────────────────────── */
#boost-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px 10px;
  background: #060c06;
  flex-shrink: 0;
  min-height: 0;
}

.boost-pill {
  font-size: 11px;
  background: #192210;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  padding: 2px 9px;
  border-radius: 20px;
}

/* ── Canvas ──────────────────────────────────────────────────────────────────── */
#canvas-wrap {
  flex-shrink: 0;
  height: 50vh;
  min-height: 180px;
  max-height: 340px;
  background: #080f08;
  border-bottom: 2px solid var(--border-hi);
  position: relative;
  overflow: hidden;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ── Scroll panel ────────────────────────────────────────────────────────────── */
#scroll-panel {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg-panel);
}

#scroll-panel::-webkit-scrollbar { width: 3px; }
#scroll-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Shared section header ───────────────────────────────────────────────────── */
.section-header {
  padding: 10px 14px 8px;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  background: linear-gradient(180deg, #0a100a, var(--bg-panel));
}

.slots-badge {
  background: var(--bg-card2);
  color: var(--accent);
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border-hi);
}

/* ── Shared disabled ─────────────────────────────────────────────────────────── */
.cant-afford { opacity: 0.38; cursor: not-allowed; }
button:disabled { cursor: not-allowed; opacity: 0.38; }

.empty-msg {
  padding: 24px;
  color: var(--text-muted);
  text-align: center;
  font-size: 13px;
}

/* ── Status dot ──────────────────────────────────────────────────────────────── */
.status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: middle;
}
.status-dot.ready {
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent);
  animation: dotPulse 2.2s ease-in-out infinite;
}
.status-dot.on-mission {
  background: var(--warn);
  box-shadow: 0 0 5px var(--warn);
  animation: dotPulse 1s ease-in-out infinite;
}
.status-dot.locked-s { background: var(--text-muted); }

@keyframes dotPulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.35; }
}

/* ── Mission progress bar ────────────────────────────────────────────────────── */
.mission-progress {
  height: 3px;
  background: var(--bg-card2);
  border-radius: 2px;
  margin-top: 7px;
  overflow: hidden;
}
.mission-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-dark), var(--accent));
  border-radius: 2px;
  transition: width 1s linear;
}

/* ═══════════════════════════════════════════════════════
   BASE PANEL
═══════════════════════════════════════════════════════ */
.base-section {
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
  background: linear-gradient(180deg, #0e160e, var(--bg-panel));
}

.base-section-title {
  font-size: 12px;
  color: var(--accent);
  margin-bottom: 2px;
  font-weight: bold;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.base-section-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.base-upgrades-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 6px;
  scrollbar-width: none;
}
.base-upgrades-strip::-webkit-scrollbar { display: none; }

.upg-box {
  flex-shrink: 0;
  width: 54px;
  height: 54px;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
}

.upg-box.done {
  background: linear-gradient(135deg, #0c1e0c, #142014);
  border-color: var(--accent-dark);
  box-shadow: inset 0 0 8px rgba(74,222,128,0.08);
  cursor: default;
}
.upg-box.affordable {
  background: linear-gradient(135deg, #193219, #254025);
  border-color: var(--accent);
  animation: glowPulse 2s ease-in-out infinite;
}
.upg-box.affordable:active { transform: scale(0.93); }
.upg-box.next {
  background: var(--bg-card);
  border-color: var(--warn-dim);
  border-style: dashed;
}
.upg-box.locked {
  background: #080d08;
  border-color: #141e14;
  opacity: 0.45;
  cursor: default;
}

@keyframes glowPulse {
  0%,100% { box-shadow: 0 0 8px rgba(74,222,128,0.3); }
  50%      { box-shadow: 0 0 22px rgba(74,222,128,0.6); }
}

.upg-check { font-size: 18px; color: var(--accent-dim); }
.upg-num   { font-size: 14px; color: var(--text-muted); }
.upg-cost  { font-size: 9px; color: var(--warn); text-align: center; line-height: 1; }

.base-section-progress { font-size: 10px; color: var(--text-muted); margin-top: 6px; }

/* ═══════════════════════════════════════════════════════
   PLANES PANEL
═══════════════════════════════════════════════════════ */
.ac-card {
  border-bottom: 1px solid var(--border);
  padding: 14px 14px 14px 18px;
  background: linear-gradient(135deg, #0d190d, #152015);
  position: relative;
  transition: background 0.2s;
}

.ac-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent);
  border-radius: 0 2px 2px 0;
}

.ac-card.locked { opacity: 0.72; }
.ac-card.locked::before { background: var(--text-muted); }

.ac-card-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 10px;
}

.ac-minicanvas {
  width: 72px;
  height: 72px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, #0a180a, #0d200d);
  border: 1px solid var(--border-hi);
  flex-shrink: 0;
}

.ac-info { flex: 1; min-width: 0; }
.ac-name {
  font-size: 14px;
  font-weight: bold;
  color: var(--text);
  letter-spacing: 0.3px;
  margin-bottom: 2px;
}
.ac-role { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
.ac-status { font-size: 11px; }
.ac-status.ready       { color: var(--accent); }
.ac-status.on-mission  { color: var(--warn); }
.ac-status.locked-status { color: var(--text-muted); }

.btn-unlock {
  font-family: inherit;
  font-size: 11px;
  padding: 8px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: linear-gradient(135deg, #183018, #204020);
  color: var(--accent);
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
  min-height: 48px;
  transition: all 0.15s;
}
.btn-unlock:active { transform: scale(0.95); }

.ac-special {
  font-size: 11px;
  color: var(--purple);
  background: linear-gradient(135deg, #141428, #1a1a34);
  border: 1px solid #3a3a5a;
  border-left: 3px solid var(--purple);
  border-radius: var(--radius);
  padding: 5px 10px;
  margin-bottom: 10px;
}

.ac-upgrades { display: flex; flex-direction: column; gap: 6px; }

.upgrade-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}

.upg-name { flex: 1; font-size: 11px; color: var(--text-muted); min-width: 0; }

.upg-pips { display: flex; gap: 3px; flex-shrink: 0; }
.pip {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1px solid var(--border-hi);
  background: transparent;
  transition: all 0.15s;
}
.pip.filled {
  background: var(--accent);
  border-color: var(--accent);
  box-shadow: 0 0 4px rgba(74,222,128,0.5);
}

.upg-maxed { font-size: 10px; color: var(--accent); padding: 2px 6px; letter-spacing: 0.5px; }

.btn-upg {
  font-family: inherit;
  font-size: 11px;
  padding: 3px 9px;
  border-radius: var(--radius);
  border: 1px solid var(--border-hi);
  background: var(--bg-card2);
  color: var(--text-muted);
  cursor: pointer;
  min-height: 28px;
  min-width: 48px;
  transition: all 0.15s;
}
.btn-upg:not(.cant-afford) {
  border-color: var(--accent);
  color: var(--accent);
  background: linear-gradient(135deg, #162816, #1e3a1e);
}
.btn-upg:not(.cant-afford):active { transform: scale(0.93); }

/* ═══════════════════════════════════════════════════════
   OPS PANEL
═══════════════════════════════════════════════════════ */
.ops-header {
  padding: 10px 14px;
  font-size: 11px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.7px;
  background: linear-gradient(180deg, #0a100a, var(--bg-panel));
}

.ac-selector {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  background: #0a100a;
}
.ac-selector::-webkit-scrollbar { display: none; }

.ac-sel-btn {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  min-height: 34px;
  white-space: nowrap;
  transition: all 0.15s;
}
.ac-sel-btn.selected {
  border-color: var(--accent);
  color: var(--accent);
  background: linear-gradient(135deg, #162816, #1e3a1e);
  box-shadow: 0 0 8px rgba(74,222,128,0.2);
}

.active-mission-banner {
  margin: 10px 12px 4px;
  padding: 10px 14px;
  background: linear-gradient(135deg, #192a0a, #1f3510);
  border: 1px solid var(--accent-dim);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius);
}

.mission-banner-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2px;
}
.mission-banner-text { font-size: 12px; color: var(--accent); }
.mission-banner-rate { font-size: 11px; color: var(--accent-dim); }

.mission-grid {
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mission-card {
  background: linear-gradient(135deg, #101a10, #162016);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-hi);
  border-radius: var(--radius);
  padding: 12px;
  position: relative;
  overflow: hidden;
  transition: border-left-color 0.2s;
}
.mission-card:not(.locked-mission) { border-left-color: var(--accent-dark); }
.mission-card.locked-mission { opacity: 0.45; }

/* Subtle corner glow */
.mission-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 50px; height: 50px;
  background: radial-gradient(circle at top right, rgba(74,222,128,0.06), transparent 70%);
  pointer-events: none;
}

.mission-name {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 3px;
  letter-spacing: 0.3px;
}
.mission-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; line-height: 1.4; }

.mission-stats {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.mission-stats span { white-space: nowrap; }

.mission-locked-msg { font-size: 11px; color: var(--danger); }

.btn-launch {
  width: 100%;
  padding: 10px;
  background: linear-gradient(135deg, #183018, #204020);
  border: 1px solid var(--accent-dark);
  border-radius: var(--radius);
  color: var(--accent);
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 0.5px;
  cursor: pointer;
  min-height: 44px;
  text-transform: uppercase;
  transition: all 0.15s;
}
.btn-launch:not(.cant-afford):active {
  transform: scale(0.98);
  box-shadow: 0 0 14px rgba(74,222,128,0.3);
}

/* ═══════════════════════════════════════════════════════
   PRESTIGE PANEL
═══════════════════════════════════════════════════════ */
.prestige-section {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #0e160e, var(--bg-panel));
}

.prestige-stars {
  font-size: 26px;
  margin-bottom: 6px;
  text-shadow: 0 0 10px rgba(250,204,21,0.4);
}
.prestige-multi {
  font-size: 14px;
  color: var(--text);
  margin-bottom: 14px;
}
.prestige-label { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; }

.prestige-bar-wrap {
  height: 8px;
  background: var(--bg-card2);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
  border: 1px solid var(--border);
}
.prestige-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-dark), var(--accent));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.prestige-numbers { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

.btn-prestige {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #1a2a0a, #243614);
  border: 1px solid var(--accent);
  border-radius: var(--radius-lg);
  color: var(--accent);
  font-family: inherit;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  min-height: 56px;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}
.btn-prestige:not(.cant-afford):active {
  transform: scale(0.98);
  box-shadow: 0 0 20px rgba(74,222,128,0.35);
}

.prestige-info {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.6;
}

.crate-buy-btn {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 8px;
  background: var(--bg-card);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  min-height: 46px;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}
.crate-buy-btn:active { transform: scale(0.97); }
.crate-buy-btn.tier-common { border: 1px solid var(--accent);  color: var(--accent); }
.crate-buy-btn.tier-rare   { border: 1px solid #60a5fa; color: #60a5fa; }
.crate-buy-btn.tier-epic   { border: 1px solid var(--warn);   color: var(--warn); }

/* ═══════════════════════════════════════════════════════
   CRATE MODAL
═══════════════════════════════════════════════════════ */
#crate-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.78);
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.crate-modal-inner {
  background: linear-gradient(180deg, #0d1a0d, #111e11);
  border: 1px solid var(--border-hi);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 22px 20px 32px;
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
  position: relative;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.crate-close {
  position: absolute;
  top: 14px; right: 14px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  min-height: 32px;
  min-width: 32px;
}

.crate-title {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

.crate-box-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }

.crate-box {
  width: 140px;
  height: 140px;
  border-radius: 18px;
  border: 3px solid;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #0a180a, #112011);
  transition: transform 0.15s;
}

.crate-box.shaking { animation: shake 0.4s ease; }

@keyframes shake {
  0%,100%{ transform: translateX(0) rotate(0deg); }
  20%    { transform: translateX(-8px) rotate(-5deg); }
  40%    { transform: translateX(8px) rotate(5deg); }
  60%    { transform: translateX(-5px) rotate(-3deg); }
  80%    { transform: translateX(5px) rotate(3deg); }
}

.crate-icon { font-size: 56px; }

.crate-reward-text {
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  line-height: 1.5;
  padding: 8px;
}

.btn-crate-open {
  width: 100%;
  padding: 16px;
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #183018, #204020);
  font-family: inherit;

// ── src/utils.js ──
function formatCredits(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

function formatRate(perSec) {
  if (perSec <= 0) return '+0/s';
  return '+' + formatCredits(perSec) + '/s';
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  if (seconds >= 3600) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return `${h}h ${m}m`;
  }
  if (seconds >= 60) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}m ${s}s`;
  }
  return `${seconds}s`;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
function randomBetween(min, max) { return min + Math.random() * (max - min); }
function randomInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }

function weightedRandom(items) {
  // items: [{weight, value}]
  const total = items.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item.value;
  }
  return items[items.length - 1].value;
}

function getArcPoint(x1, y1, x2, y2, t, bend = 0.28) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const cx = mx - dy * bend;
  const cy = my + dx * bend;
  const it = 1 - t;
  return {
    x: it*it*x1 + 2*it*t*cx + t*t*x2,
    y: it*it*y1 + 2*it*t*cy + t*t*y2
  };
}

function deepMerge(target, source) {
  const result = { ...target };
  for (const key of Object.keys(source)) {
    if (source[key] !== null && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      result[key] = deepMerge(target[key] || {}, source[key]);
    } else if (result[key] === undefined) {
      result[key] = source[key];
    }
  }
  return result;
}

function getMissionsByAircraft(id) {
  return MISSIONS[id] || [];
}

function getMission(aircraftId, missionId) {
  return (MISSIONS[aircraftId] || []).find(m => m.id === missionId);
}

function getMissionDuration(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const crewTier = ac ? ac.upgrades[1] : 0;
  const crewBonus = 1 - crewTier * 0.1;

  // Building bonuses
  const fuelBonus = 1 - (state.baseUpgrades.fuel || 0) * 0.05;
  const intelBonus = 1 - (state.baseUpgrades.command || 0) * 0.03;

  // KC-135 tanker bonus
  const kc135 = state.aircraft.kc135;
  const tankerBonus = (kc135 && kc135.currentMission) ? 0.85 : 1;

  return Math.round(m.duration * crewBonus * fuelBonus * intelBonus * tankerBonus);
}

function getMissionPayout(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const avionicsTier = ac ? ac.upgrades[2] : 0;
  const avionicsBonus = 1 + avionicsTier * 0.15;

  const armBonus = 1 + (state.baseUpgrades.armaments || 0) * 0.08;
  const cmdBonus = 1 + (state.baseUpgrades.command || 0) * 0.04;

  const prestigeBonus = 1 + (state.prestigeStars || 0) * 0.25;

  // E-3 force multiplier
  const e3 = state.aircraft.e3;
  const e3Bonus = (e3 && e3.currentMission) ? 1.3 : 1;

  // Payout boost from active boosts
  const now = Date.now();
  const payoutBoost = (state.activeBoosts || [])
    .filter(b => b.type === 'payout' && b.expiresAt > now)
    .reduce((acc, b) => acc * b.multiplier, 1);

  return Math.round(m.payout * avionicsBonus * armBonus * cmdBonus * prestigeBonus * e3Bonus * payoutBoost);
}

function getMissionPassive(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const airframeTier = ac ? ac.upgrades[0] : 0;
  const airframeBonus = 1 + airframeTier * 0.20;

  const airfieldBonus = 1 + (state.baseUpgrades.airfield || 0) * 0.05;
  const fuelBonus = 1 + (state.baseUpgrades.fuel || 0) * 0.02;
  const cmdBonus = 1 + (state.baseUpgrades.command || 0) * 0.04;

  const prestigeBonus = 1 + (state.prestigeStars || 0) * 0.25;

  const e3 = state.aircraft.e3;
  const e3Bonus = (e3 && e3.currentMission) ? 1.3 : 1;

  const now = Date.now();
  const incomeBoost = (state.activeBoosts || [])
    .filter(b => b.type === 'income' && b.expiresAt > now)
    .reduce((acc, b) => acc * b.multiplier, 1);

  return m.passive * airframeBonus * airfieldBonus * fuelBonus * cmdBonus * prestigeBonus * e3Bonus * incomeBoost;
}

  epic:   { bg:'#2a1a0a', border:'#fbbf24', glow:'rgba(251,191,36,0.5)',  label:'EPIC CRATE' },
};

function rollCrate(tier) {
  const table = LOOT_TABLES[tier];
  const roller = weightedRandom(table);
  const reward = roller();
  reward.label = formatRewardLabel(reward);
  return reward;
}

function formatRewardLabel(reward) {
  switch (reward.type) {
    case 'credits':
      return `+${Math.round(reward.amount).toLocaleString()} Credits`;
    case 'boost':
      const mins = Math.round(reward.duration / 60000);
      const name = reward.kind === 'income' ? 'Income' : reward.kind === 'payout' ? 'Payout' : 'Speed';
      return `${name} ×${reward.multiplier} for ${mins}m`;
    case 'instant_complete':
      return reward.count === 'all' ? 'Complete All Missions!' : 'Instant Mission Complete ×1';
    case 'crates':
      return `+${reward.count} Crates!`;
    case 'prestige_bonus':
      return `+${reward.stars} Prestige Star!`;
    case 'unlock_next':
      return 'Unlock Next Aircraft Free!';
    default:
      return 'Mystery Reward';
  }
}

// Called on mission completion — returns tier to queue, or null
function rollMissionCrateDrop(totalMissions) {
  // Milestone guarantees
  if (totalMissions % 50 === 0) return 'epic';
  if (totalMissions % 10 === 0) return 'rare';
  // Random drop
  const r = Math.random();
  if (r < 0.01) return 'epic';
  if (r < 0.06) return 'rare';
  if (r < 0.22) return 'common';
  return null;
}

function applyReward(reward, state) {
  const now = Date.now();
  switch (reward.type) {
    case 'credits':
      state.credits += reward.amount;
      state.totalCreditsEarned += reward.amount;
      break;
    case 'boost':
      // Stack or extend existing boost of same kind
      const existing = state.activeBoosts.find(b => b.type === reward.kind && b.multiplier === reward.multiplier);
      if (existing) {
        existing.expiresAt = Math.max(existing.expiresAt, now) + reward.duration;
      } else {
        state.activeBoosts.push({ type: reward.kind, multiplier: reward.multiplier, expiresAt: now + reward.duration });
      }
      break;
    case 'instant_complete':
      // Flag for main.js to handle
      state._pendingInstantComplete = reward.count;
      break;
    case 'crates':
      for (let i = 0; i < reward.count; i++) {
        state.crateQueue.push(reward.tier);
      }
      break;
    case 'prestige_bonus':
      state.prestigeStars += reward.stars;
      break;
    case 'unlock_next':
      state._pendingUnlockNext = true;
      break;
  }
}

const SAVE_KEY = 'MILGAME_STATE';
const SCHEMA_VERSION = 2;

function defaultAircraftState(id) {
  return { unlocked: id === 'ac130' || id === 'a10', upgrades: [0,0,0,0,0], currentMission: null, cooldownUntil: 0, totalMissionsFlown: 0 };
}

const DEFAULT_STATE = {
  version: SCHEMA_VERSION,
  lastSave: 0,
  lastTick: 0,
  credits: 500,
  prestigeStars: 0,
  totalCreditsEarned: 500,
  totalMissionsCompleted: 0,
  aircraft: Object.fromEntries(AIRCRAFT.map(a => [a.id, defaultAircraftState(a.id)])),
  baseUpgrades: { airfield: 0, fuel: 0, armaments: 0, personnel: 0, command: 0 },
  sr71Zones: [],
  activeBoosts: [],
  crateQueue: [],
  totalCratesOpened: 0,
  _pendingInstantComplete: null,
  _pendingUnlockNext: false,
  settings: { animationsEnabled: true },
};

let state = structuredClone(DEFAULT_STATE);

function migrateState(raw) {
  if (!raw || typeof raw !== 'object') return structuredClone(DEFAULT_STATE);
  const merged = deepMerge(structuredClone(DEFAULT_STATE), raw);
  // Ensure all aircraft entries exist
  for (const a of AIRCRAFT) {
    if (!merged.aircraft[a.id]) merged.aircraft[a.id] = defaultAircraftState(a.id);
    if (!Array.isArray(merged.aircraft[a.id].upgrades)) merged.aircraft[a.id].upgrades = [0,0,0,0,0];
  }
  merged.version = SCHEMA_VERSION;
  return merged;
}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    state = migrateState(raw);
  } catch {
    state = structuredClone(DEFAULT_STATE);
  }
}

function saveState() {
  state.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}

function applyOfflineEarnings() {
  const now = Date.now();
  const elapsed = (now - (state.lastTick || now)) / 1000; // seconds
  if (elapsed <= 0) { state.lastTick = now; return; }

  for (const ac of AIRCRAFT) {
    const acState = state.aircraft[ac.id];
    if (!acState || !acState.currentMission) continue;
    const m = acState.currentMission;

    if (m.endTime <= now) {
      // Mission completed while offline
      addCredits(m.payoutOnComplete);
      acState.totalMissionsFlown++;
      state.totalMissionsCompleted++;
      const drop = rollMissionCrateDrop(state.totalMissionsCompleted);
      if (drop) state.crateQueue.push(drop);
      acState.currentMission = null;
      acState.cooldownUntil = 0;
    } else {
      // Still in progress — credit passive income up to now
      const passiveSecs = Math.min(elapsed, (m.endTime - (state.lastTick || now)) / 1000);
      if (passiveSecs > 0) addCredits(m.passivePerSec * passiveSecs);
    }
  }
  state.lastTick = now;
}

// ── Computed helpers ──────────────────────────────────────────────────────────

function getActiveMissionCount() {
  return AIRCRAFT.filter(a => {
    const ac = state.aircraft[a.id];
    return ac && ac.currentMission && ac.currentMission.endTime > Date.now();
  }).length;
}

function canStartMission() {
  return getActiveMissionCount() < getMaxMissionSlots(state);
}

function getTotalPassiveRate() {
  const now = Date.now();
  return AIRCRAFT.reduce((sum, a) => {
    const ac = state.aircraft[a.id];
    if (!ac || !ac.currentMission || ac.currentMission.endTime <= now) return sum;
    return sum + ac.currentMission.passivePerSec;
  }, 0);
}

// ── Mutations ─────────────────────────────────────────────────────────────────

function addCredits(amount) {
  state.credits += amount;
  state.totalCreditsEarned += amount;
}

function spendCredits(amount) {
  if (state.credits < amount) return false;
  state.credits -= amount;
  return true;
}

function startMission(aircraftId, missionId) {
  const acState = state.aircraft[aircraftId];
  if (!acState || !acState.unlocked) return false;
  if (acState.currentMission) return false;
  if (!canStartMission()) return false;

  const dur = getMissionDuration(aircraftId, missionId, state);
  const payout = getMissionPayout(aircraftId, missionId, state);
  const passive = getMissionPassive(aircraftId, missionId, state);
  const now = Date.now();

  acState.currentMission = {
    missionId,
    startTime: now,
    endTime: now + dur * 1000,
    payoutOnComplete: payout,
    passivePerSec: passive,
  };
  return true;
}

function completeMission(aircraftId) {
  const acState = state.aircraft[aircraftId];
  if (!acState || !acState.currentMission) return;
  addCredits(acState.currentMission.payoutOnComplete);
  acState.totalMissionsFlown++;
  state.totalMissionsCompleted++;

  // SR-71 zone unlock
  if (aircraftId === 'sr71') {
    const zones = ['zone_alpha','zone_bravo','zone_charlie','zone_delta','zone_echo'];
    for (const z of zones) {
      if (!state.sr71Zones.includes(z)) { state.sr71Zones.push(z); break; }
    }
  }

  const drop = rollMissionCrateDrop(state.totalMissionsCompleted);
  if (drop) state.crateQueue.push(drop);

  acState.currentMission = null;
  acState.cooldownUntil = 0;
}

function upgradeAircraft(aircraftId, slotIndex) {
  const acState = state.aircraft[aircraftId];
  const acDef   = AIRCRAFT.find(a => a.id === aircraftId);
  if (!acState || !acDef || !acState.unlocked) return false;
  const currentTier = acState.upgrades[slotIndex];
  if (currentTier >= 5) return false;
  const cost = acDef.upgradeCosts[slotIndex][currentTier];
  if (!spendCredits(cost)) return false;
  acState.upgrades[slotIndex]++;
  return true;
}

function unlockAircraft(aircraftId) {
  const acDef = AIRCRAFT.find(a => a.id === aircraftId);
  const acState = state.aircraft[aircraftId];
  if (!acDef || !acState || acState.unlocked) return false;
  if (!spendCredits(acDef.unlockCost)) return false;
  acState.unlocked = true;
  return true;
}

function buyBaseUpgrade(sectionKey) {
  const currentLevel = state.baseUpgrades[sectionKey] || 0;
  const section = BASE_SECTIONS.find(s => s.key === sectionKey);
  if (!section || currentLevel >= section.upgrades.length) return false;
  const cost = section.upgrades[currentLevel].cost;
  if (!spendCredits(cost)) return false;
  state.baseUpgrades[sectionKey]++;
  return true;
}

function prestige() {
  if (state.totalCreditsEarned < prestigeThreshold()) return false;
  state.prestigeStars++;
  // Reset credits and missions but keep aircraft unlocks, upgrades, base upgrades
  state.credits = 0;
  state.totalCreditsEarned = 0;
  state.totalMissionsCompleted = 0;
  state.activeBoosts = [];
  state.crateQueue = [];
  for (const ac of AIRCRAFT) {
    state.aircraft[ac.id].currentMission = null;
    state.aircraft[ac.id].cooldownUntil = 0;
    state.aircraft[ac.id].totalMissionsFlown = 0;
  }
  return true;
}

function prestigeThreshold() {
  return 500000 * Math.pow(3, state.prestigeStars);
}

function openNextCrate() {
  if (!state.crateQueue.length) return null;
  const tier = state.crateQueue.shift();
  state.totalCratesOpened++;
  const reward = rollCrate(tier);
  applyReward(reward, state);
  return { tier, reward };
}

function buyCrate(tier) {
  const cost = CRATE_COSTS[tier];
  if (!spendCredits(cost)) return false;
  state.crateQueue.push(tier);
  return true;
}

function pruneExpiredBoosts() {
  const now = Date.now();
  state.activeBoosts = state.activeBoosts.filter(b => b.expiresAt > now);
}


// ── src/renderer.js ──



let canvas, ctx, dpr = 1, W = 0, H = 0;
let bgCache = null;

// Design space: 375 × 300 logical pixels, scaled to actual canvas at runtime
function x(v) { return v * (W / 375); }
function y(v) { return v * (H / 300); }
function s(v) { return v * Math.min(W / 375, H / 300); }

let L = {}; // computed layout

const flashes   = {};  // id → { t: 0→1 }
const particles = [];  // floating +credit text

function initRenderer(canvasEl) {
  canvas = canvasEl;
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); bgCache = null; });
}

function resizeCanvas() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const rect = canvas.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  computeLayout();
  bgCache = null;
}

function computeLayout() {
  const padXs = [x(72), x(132), x(192), x(252), x(312)];
  L = {
    skyH:   y(44),
    rwX1:   x(0),   rwX2:   x(375), rwY1:  y(44), rwY2:  y(82),  rwY: y(63),
    taxiCX: x(192), taxiW:  x(52),  taxiY1: y(82), taxiY2: y(108),
    apX1:   x(0),   apX2:   x(375), apY1:   y(108), apY2:  y(278),
    pads: [
      ...padXs.map(px => ({ x: px, y: y(160) })),
      ...padXs.map(px => ({ x: px, y: y(228) })),
    ],
    // Building regions (flanking the apron)
    hgX: x(4),   hgY: y(112), hgW: x(55), hgH: y(55),
    twX: x(316), twY: y(112), twW: x(55), twH: y(55),
    fuX: x(4),   fuY: y(192),
    amX: x(316), amY: y(192),
    fenceY: y(282),
    // Zone target positions (edges of canvas, clockwise from top-left)
    zones: [
      [x(28),  y(22)], [x(100), y(16)], [x(192), y(14)], [x(284), y(16)], [x(348), y(22)],
      [x(8),   y(180)],[x(367), y(170)],[x(8),   y(248)],[x(367), y(248)],[x(192), y(292)],
    ],
  };
}

// ── Geometry helpers ──────────────────────────────────────────────────────────

function poly(pts, fill, stroke, sw) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  ctx.closePath();
  if (fill)   { ctx.fillStyle   = fill;   ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1; ctx.stroke(); }
}

function rectFill(x1, y1, x2, y2, fill) { ctx.fillStyle = fill; ctx.fillRect(x1, y1, x2 - x1, y2 - y1); }

function circ(cx, cy, r, fill, stroke, sw) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  if (fill)   { ctx.fillStyle   = fill;   ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw || 1; ctx.stroke(); }
}

function roundRect(rx, ry, rw, rh, r) {
  ctx.beginPath();
  ctx.moveTo(rx + r, ry);
  ctx.lineTo(rx + rw - r, ry);
  ctx.arcTo(rx + rw, ry, rx + rw, ry + r, r);
  ctx.lineTo(rx + rw, ry + rh - r);
  ctx.arcTo(rx + rw, ry + rh, rx + rw - r, ry + rh, r);
  ctx.lineTo(rx + r, ry + rh);
  ctx.arcTo(rx, ry + rh, rx, ry + rh - r, r);
  ctx.lineTo(rx, ry + r);
  ctx.arcTo(rx, ry, rx + r, ry, r);
  ctx.closePath();
}

// ── Static background (cached to offscreen canvas) ────────────────────────────

function buildBackground() {
  const oc  = document.createElement('canvas');
  oc.width  = Math.round(W * dpr);
  oc.height = Math.round(H * dpr);
  const bc  = oc.getContext('2d');
  bc.scale(dpr, dpr);

  const _ctx = ctx;
  ctx = bc;

  drawSky();
  drawRunway();
  drawTaxiway();
  drawApron();
  drawHangars();
  drawControlTower();
  drawFuelDepot();
  drawArmaments();
  drawPadMarkings();

  ctx = _ctx;
  bgCache = oc;
}

function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, L.skyH);
  grad.addColorStop(0, '#07111a');
  grad.addColorStop(1, '#0d1a10');
  rectFill(0, 0, W, L.skyH, '#07111a');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, L.skyH);

  // Treeline silhouette
  ctx.fillStyle = '#0a1408';
  for (let tx = x(5); tx < W + x(10); tx += x(16)) {
    const jitter = Math.abs(Math.sin(tx * 0.08)) * y(5);
    const th = y(6) + jitter;
    poly([
      [tx - x(7), L.skyH - y(1)],
      [tx,        L.skyH - y(1) - th],
      [tx + x(7), L.skyH - y(1)],
    ], '#0e1a0c');
  }
  // Distant mountains
  ctx.fillStyle = 'rgba(15,28,20,0.5)';
  poly([
    [0, L.skyH],[x(60), L.skyH - y(18)],[x(130), L.skyH - y(10)],
    [x(200), L.skyH - y(22)],[x(280), L.skyH - y(12)],[x(340), L.skyH - y(20)],
    [W, L.skyH],
  ], 'rgba(15,28,20,0.5)');
}

function drawRunway() {
  // Concrete surface
  rectFill(L.rwX1, L.rwY1, L.rwX2, L.rwY2, '#28302a');

  // Edge stripes
  rectFill(L.rwX1, L.rwY1, L.rwX2, L.rwY1 + s(2.5), 'rgba(220,215,175,0.45)');
  rectFill(L.rwX1, L.rwY2 - s(2.5), L.rwX2, L.rwY2, 'rgba(220,215,175,0.45)');

  // Centerline
  ctx.save();
  ctx.setLineDash([s(22), s(14)]);
  ctx.strokeStyle = 'rgba(220,215,175,0.35)';
  ctx.lineWidth   = s(2);
  ctx.beginPath();
  ctx.moveTo(L.rwX1 + x(38), L.rwY);
  ctx.lineTo(L.rwX2 - x(38), L.rwY);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  // Threshold bars — left end
  for (let i = 0; i < 5; i++) {
    const bx = L.rwX1 + x(10 + i * 8);
    rectFill(bx, L.rwY1 + s(5), bx + s(5), L.rwY2 - s(5), 'rgba(220,215,175,0.48)');
  }
  // Threshold bars — right end
  for (let i = 0; i < 5; i++) {
    const bx = L.rwX2 - x(10 + (i + 1) * 8);
    rectFill(bx, L.rwY1 + s(5), bx + s(5), L.rwY2 - s(5), 'rgba(220,215,175,0.48)');
  }

  // Runway number labels
  ctx.save();
  ctx.fillStyle = 'rgba(220,215,175,0.3)';
  ctx.font      = `bold ${s(14)}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('28', L.rwX1 + x(28), L.rwY);
  ctx.fillText('10', L.rwX2 - x(28), L.rwY);
  ctx.restore();
}

function drawTaxiway() {
  rectFill(L.taxiCX - L.taxiW / 2, L.taxiY1, L.taxiCX + L.taxiW / 2, L.taxiY2, '#252a26');
  // Hold-short bar at runway edge
  ctx.fillStyle = 'rgba(240,180,0,0.5)';
  ctx.fillRect(L.taxiCX - L.taxiW / 2, L.taxiY1, L.taxiW, s(2));
  ctx.fillRect(L.taxiCX - L.taxiW / 2, L.taxiY1 + s(4), L.taxiW, s(2));
  // Yellow centerline
  ctx.save();
  ctx.setLineDash([s(8), s(8)]);
  ctx.strokeStyle = 'rgba(240,180,0,0.38)';
  ctx.lineWidth   = s(1.5);
  ctx.beginPath();
  ctx.moveTo(L.taxiCX, L.taxiY1 + s(6));
  ctx.lineTo(L.taxiCX, L.taxiY2);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function drawApron() {
  // Apron surface
  rectFill(L.apX1, L.apY1, L.apX2, L.apY2, '#212621');

  // Subtle grid
  ctx.strokeStyle = 'rgba(74,222,128,0.04)';
  ctx.lineWidth   = 0.5;
  for (let lx = L.apX1; lx <= L.apX2; lx += x(40)) {
    ctx.beginPath(); ctx.moveTo(lx, L.apY1); ctx.lineTo(lx, L.apY2); ctx.stroke();
  }
  for (let ly = L.apY1; ly <= L.apY2; ly += y(35)) {
    ctx.beginPath(); ctx.moveTo(L.apX1, ly); ctx.lineTo(L.apX2, ly); ctx.stroke();
  }

  // Perimeter fence
  ctx.strokeStyle = 'rgba(74,222,128,0.2)';
  ctx.lineWidth   = s(1.5);
  ctx.setLineDash([s(4), s(6)]);
  ctx.beginPath(); ctx.moveTo(L.apX1, L.fenceY); ctx.lineTo(L.apX2, L.fenceY); ctx.stroke();
  ctx.setLineDash([]);
}

function drawHangars() {
  // 3 hangars stacked vertically on left side of apron
  const hx = L.hgX, hw = L.hgW, hh = L.hgH * 0.52;
  for (let i = 0; i < 3; i++) {
    const hy = L.hgY + i * (hh + y(3));
    if (hy + hh > L.apY2 - y(8)) break;
    // Wall body
    rectFill(hx, hy, hx + hw, hy + hh, '#1d2c1d');
    ctx.strokeRect(hx, hy, hw, hh);
    ctx.strokeStyle = '#2a402a'; ctx.lineWidth = s(0.5); ctx.strokeRect(hx, hy, hw, hh);
    // Roof highlight (top face)
    rectFill(hx, hy, hx + hw, hy + y(5), '#2a3c2a');
    // Arch apex line
    ctx.strokeStyle = '#324832'; ctx.lineWidth = s(1);
    ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx + hw / 2, hy - y(4)); ctx.lineTo(hx + hw, hy); ctx.stroke();
    // Door opening
    const dw = hw * 0.55, dc = hx + hw / 2;
    rectFill(dc - dw / 2, hy + hh - y(10), dc + dw / 2, hy + hh, '#0c100c');
    // Label
    ctx.fillStyle = 'rgba(74,222,128,0.22)';
    ctx.font = `${s(7)}px monospace`;
    ctx.textAlign = 'center';
    ctx.fillText(`HGR ${i + 1}`, hx + hw / 2, hy + y(13));
  }
}

function drawControlTower() {
  const tx = L.twX, ty = L.twY, tw = L.twW, th = L.twH;
  const bw = tw * 0.38, bcx = tx + tw / 2;
  // Base column
  rectFill(bcx - bw / 2, ty + th * 0.32, bcx + bw / 2, ty + th, '#1f301f');
  ctx.strokeStyle = '#2a4030'; ctx.lineWidth = s(0.5);
  ctx.strokeRect(bcx - bw / 2, ty + th * 0.32, bw, th * 0.68);
  // Observation deck
  rectFill(tx, ty + th * 0.15, tx + tw, ty + th * 0.34, '#263826');
  ctx.strokeStyle = '#364e36'; ctx.lineWidth = s(0.5);
  ctx.strokeRect(tx, ty + th * 0.15, tw, th * 0.19);
  // Glass strip (illuminated)
  rectFill(tx + tw * 0.08, ty + th * 0.17, tx + tw * 0.92, ty + th * 0.27, 'rgba(74,222,128,0.1)');
  // Antenna
  ctx.strokeStyle = '#3a5a3a'; ctx.lineWidth = s(1.5);
  ctx.beginPath(); ctx.moveTo(bcx, ty + th * 0.15); ctx.lineTo(bcx, ty); ctx.stroke();
  circ(bcx, ty + y(3), s(4), '#263826', '#3a5a3a', s(0.5));
  // Label
  ctx.fillStyle = 'rgba(74,222,128,0.25)';
  ctx.font = `${s(7)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('TOWER', bcx, ty + th * 0.46);
}

function drawFuelDepot() {
  const fx = L.fuX, fy = L.fuY;
  const tanks = [[x(16), y(14), 12], [x(33), y(7), 9], [x(25), y(28), 8]];
  for (const [dx, dy, r] of tanks) {
    circ(fx + dx, fy + dy, s(r), '#1e2014', '#2c2e1a', s(0.5));
    // Pipe cross
    ctx.strokeStyle = 'rgba(180,160,60,0.28)';
    ctx.lineWidth   = s(1);
    const cr = s(r * 0.65);
    ctx.beginPath(); ctx.moveTo(fx + dx - cr, fy + dy); ctx.lineTo(fx + dx + cr, fy + dy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(fx + dx, fy + dy - cr); ctx.lineTo(fx + dx, fy + dy + cr); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(180,160,60,0.3)';
  ctx.font = `${s(7)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('FUEL', fx + x(23), fy + y(42));
}

function drawArmaments() {
  const ax = L.amX, ay = L.amY;
  const bldgs = [[x(4), y(4), x(24), y(28)], [x(28), y(10), x(51), y(34)]];
  for (const [bx1, by1, bx2, by2] of bldgs) {
    rectFill(ax + bx1, ay + by1, ax + bx2, ay + by2, '#201c14');
    ctx.strokeStyle = '#3a3020'; ctx.lineWidth = s(0.5);
    ctx.strokeRect(ax + bx1, ay + by1, bx2 - bx1, by2 - by1);
  }
  // Hazard stripes on first building
  ctx.strokeStyle = 'rgba(240,180,0,0.28)'; ctx.lineWidth = s(1.5);
  ctx.setLineDash([s(4), s(4)]);
  ctx.strokeRect(ax + x(4) + s(2), ay + y(4) + s(2), x(20) - s(4), y(24) - s(4));
  ctx.setLineDash([]);
  ctx.fillStyle = 'rgba(240,180,0,0.3)';
  ctx.font = `${s(7)}px monospace`;
  ctx.textAlign = 'center';
  ctx.fillText('ARMS', ax + x(28), ay + y(42));
}

function drawPadMarkings() {
  // Static pad ring for each aircraft slot
  AIRCRAFT.forEach((acDef, i) => {
    const pad = L.pads[i];
    if (!pad) return;
    circ(pad.x, pad.y, s(22), 'rgba(74,222,128,0.03)', 'rgba(74,222,128,0.14)', s(1));
  });
}

// ── Aircraft rendering ────────────────────────────────────────────────────────

function drawAircraft(acDef, cx, cy, sc, alpha, glowing) {
  ctx.save();
  if (glowing) {
    ctx.shadowBlur  = s(18);
    ctx.shadowColor = acDef.color;
  }
  for (const part of acDef.parts) {
    const a = alpha * (part.alpha !== undefined ? part.alpha : 1);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(cx + part.points[0][0] * sc, cy + part.points[0][1] * sc);
    for (let i = 1; i < part.points.length; i++) {
      ctx.lineTo(cx + part.points[i][0] * sc, cy + part.points[i][1] * sc);
    }
    ctx.closePath();
    ctx.fillStyle = part.color;
    ctx.fill();
  }
  ctx.restore();
}

function drawLockOverlay(cx, cy) {
  circ(cx, cy, s(22), 'rgba(0,0,0,0.52)', null);
  ctx.save();
  ctx.fillStyle    = 'rgba(180,180,180,0.48)';
  ctx.font         = `${s(16)}px sans-serif`;
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔒', cx, cy);
  ctx.restore();
}

// ── Mission arcs ──────────────────────────────────────────────────────────────

function drawMissionArc(acDef, pad, zx, zy, progress, ts) {
  ctx.save();

  // Dashed arc
  ctx.setLineDash([s(6), s(5)]);
  ctx.lineWidth   = s(1.5);
  ctx.strokeStyle = acDef.color + '65';
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const pt = getArcPoint(pad.x, pad.y, zx, zy, i / 40);
    if (i === 0) ctx.moveTo(pt.x, pt.y);
    else         ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Zone target (pulsing crosshair)
  const pulse = 0.55 + Math.sin(ts * 0.0038) * 0.28;
  const r     = s(7 + Math.sin(ts * 0.003) * 2);
  ctx.globalAlpha = pulse;
  circ(zx, zy, r, null, acDef.color, s(1.5));
  circ(zx, zy, r * 0.35, acDef.color + 'cc', null);
  // Crosshair lines
  ctx.strokeStyle = acDef.color;
  ctx.lineWidth   = s(1);
  ctx.beginPath(); ctx.moveTo(zx - r * 1.5, zy); ctx.lineTo(zx - r * 0.6, zy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(zx + r * 0.6, zy); ctx.lineTo(zx + r * 1.5, zy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(zx, zy - r * 1.5); ctx.lineTo(zx, zy - r * 0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(zx, zy + r * 0.6); ctx.lineTo(zx, zy + r * 1.5); ctx.stroke();
  ctx.globalAlpha = 1;

  // Traveling dot
  const dotPt = getArcPoint(pad.x, pad.y, zx, zy, easeInOut(progress));
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.shadowBlur  = s(10);
  ctx.shadowColor = acDef.color;
  circ(dotPt.x, dotPt.y, s(4.5), acDef.color, null);
  ctx.restore();

  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────────────────────────

function triggerCompletionFlash(aircraftId, payout) {
  flashes[aircraftId] = { t: 0 };
  const i = AIRCRAFT.findIndex(a => a.id === aircraftId);
  if (i >= 0 && L.pads[i]) {
    const pad    = L.pads[i];
    const acDef  = AIRCRAFT[i];
    const label  = payout ? '+' + formatCredits(payout) : '+ MISSION COMPLETE';
    particles.push({
      wx:    pad.x + (Math.random() - 0.5) * s(12),
      wy:    pad.y - s(12),
      text:  label,
      color: acDef.color,
      age:   0,
      life:  1.8,
      vy:    -s(28),
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p  = particles[i];
    p.age   += dt;
    p.wy    += p.vy * dt;
    p.vy    *= 0.97;
    if (p.age >= p.life) particles.splice(i, 1);
  }
}

function drawParticles() {
  for (const p of particles) {
    const prog  = p.age / p.life;
    const alpha = prog < 0.25 ? prog / 0.25 : 1 - (prog - 0.25) / 0.75;
    ctx.save();
    ctx.globalAlpha  = clamp(alpha, 0, 1);
    ctx.shadowBlur   = s(7);
    ctx.shadowColor  = p.color;
    ctx.fillStyle    = p.color;
    ctx.font         = `bold ${s(13)}px monospace`;
    ctx.textAlign    = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.text, p.wx, p.wy);
    ctx.restore();
  }
}

// ── Completion flash ──────────────────────────────────────────────────────────

function drawFlash(id, cx, cy) {
  const flash = flashes[id];
  if (!flash) return;
  const r = flash.t * s(46);
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(74,222,128,${(1 - flash.t) * 0.65})`;
  ctx.fill();
  ctx.restore();
  flash.t += 0.045;
  if (flash.t >= 1) delete flashes[id];
}

// ── Main render ───────────────────────────────────────────────────────────────

let _lastTs = 0;

function renderFrame(st, ts, dt) {
  if (W === 0 || H === 0) return;
  if (!bgCache) buildBackground();

  const frameDt = dt !== undefined ? dt : Math.min((ts - (_lastTs || ts)) / 1000, 0.1);
  _lastTs = ts;

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCache, 0, 0, W, H);

  updateParticles(frameDt);

  const now = Date.now();
  const sc  = s(36); // aircraft scale

  // Animated runway edge lights (pulse together)
  const lAlpha = 0.38 + Math.sin(ts * 0.0025) * 0.22;
  ctx.fillStyle = `rgba(220,215,175,${lAlpha})`;
  for (let lx = L.rwX1 + s(8); lx < L.rwX2; lx += s(30)) {
    ctx.beginPath(); ctx.arc(lx, L.rwY1 + s(4), s(1.8), 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(lx, L.rwY2 - s(4), s(1.8), 0, Math.PI * 2); ctx.fill();
  }

  // Taxiway blue edge lights (slower pulse, offset)
  const bAlpha = 0.28 + Math.sin(ts * 0.002 + 1.8) * 0.14;
  ctx.fillStyle = `rgba(100,170,255,${bAlpha})`;
  for (let ly = L.taxiY1 + s(7); ly < L.taxiY2; ly += s(12)) {
    ctx.beginPath(); ctx.arc(L.taxiCX - L.taxiW / 2 + s(3.5), ly, s(1.5), 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(L.taxiCX + L.taxiW / 2 - s(3.5), ly, s(1.5), 0, Math.PI * 2); ctx.fill();
  }

  // E-3 Sentry radar sweep
  const e3 = st.aircraft.e3;
  if (e3 && e3.currentMission && e3.currentMission.endTime > now) {
    const angle = (ts * 0.001) % (Math.PI * 2);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, Math.max(W, H) * 0.75, -0.22, 0.22);
    ctx.closePath();
    ctx.fillStyle = 'rgba(139,233,253,0.045)';
    ctx.fill();
    ctx.restore();
  }

  // Mission arcs (drawn before aircraft so arcs appear under dots)
  AIRCRAFT.forEach((acDef, i) => {
    const acState = st.aircraft[acDef.id];
    if (!acState || !acState.unlocked || !acState.currentMission) return;
    const m = acState.currentMission;
    if (m.endTime <= now) return;
    const pad  = L.pads[i];
    const zone = L.zones[i % L.zones.length];
    if (!pad || !zone) return;
    const progress = clamp((now - m.startTime) / (m.endTime - m.startTime), 0, 1);
    drawMissionArc(acDef, pad, zone[0], zone[1], progress, ts);
  });

  // Aircraft on pads
  AIRCRAFT.forEach((acDef, i) => {
    const acState = st.aircraft[acDef.id];
    const pad     = L.pads[i];
    if (!pad) return;

    const onMission = acState && acState.currentMission && acState.currentMission.endTime > now;

    if (!acState || !acState.unlocked) {
      drawAircraft(acDef, pad.x, pad.y, sc, 0.16, false);
      drawLockOverlay(pad.x, pad.y);
    } else if (onMission) {
      // Ghost / dim while away
      drawAircraft(acDef, pad.x, pad.y, sc, 0.22, false);
    } else {
      // Ready — breathing glow
      const breathe = 0.82 + Math.sin(ts * 0.002 + i * 1.1) * 0.18;
      drawAircraft(acDef, pad.x, pad.y, sc, breathe, true);
    }

    drawFlash(acDef.id, pad.x, pad.y);
  });

  drawParticles();
  drawHUD(st, now, ts);
}

function drawHUD(st, now, ts) {
  // Credits pill — top right
  const credStr = formatCredits(st.credits);
  const pillW   = s(16 + credStr.length * 9);
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.58)';
  roundRect(W - pillW - s(6), s(5), pillW, s(20), s(5));
  ctx.fill();
  ctx.fillStyle    = '#4ade80';
  ctx.shadowBlur   = s(7);
  ctx.shadowColor  = '#4ade80';
  ctx.font         = `bold ${s(12)}px monospace`;
  ctx.textAlign    = 'right';
  ctx.textBaseline = 'middle';
  ctx.fillText(credStr, W - s(10), s(15));
  ctx.restore();

  // Active missions pill — top left
  const activeCt = AIRCRAFT.filter(a => {
    const ac = st.aircraft[a.id];
    return ac && ac.currentMission && ac.currentMission.endTime > now;
  }).length;

  if (activeCt > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.58)';
    roundRect(s(6), s(5), s(72), s(20), s(5));
    ctx.fill();
    ctx.fillStyle    = '#facc15';
    ctx.shadowBlur   = s(5);
    ctx.shadowColor  = '#facc15';
    ctx.font         = `${s(11)}px monospace`;
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`✈ ${activeCt} active`, s(12), s(15));
    ctx.restore();
  }

  // Prestige stars pill — bottom of canvas
  const stars = st.prestigeStars || 0;
  if (stars > 0) {
    ctx.save();
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    roundRect(s(6), H - s(24), s(60), s(18), s(5));
    ctx.fill();
    ctx.fillStyle    = '#facc15';
    ctx.font         = `${s(10)}px monospace`;
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(`★ ×${stars}  ×${(1 + stars * 0.25).toFixed(2)}`, s(12), H - s(15));
    ctx.restore();
  }
}


// ── src/ui.js ──






let callbacks = {};
let activeTab = 'base';
let selectedAircraftId = 'ac130';
let crateAnimating = false;
let crateResult = null;

// DOM refs
let tabBar, statsBar, boostBar, scrollPanel;
let panelBase, panelPlanes, panelOps, panelPrestige;
let crateModal, crateBox, crateLabel, crateReward, crateTier;

function initUI() {
  tabBar     = document.getElementById('tab-bar');
  statsBar   = document.getElementById('stats-bar');
  boostBar   = document.getElementById('boost-bar');
  scrollPanel= document.getElementById('scroll-panel');
  panelBase  = document.getElementById('panel-base');
  panelPlanes= document.getElementById('panel-planes');
  panelOps   = document.getElementById('panel-ops');
  panelPrestige=document.getElementById('panel-prestige');
  crateModal = document.getElementById('crate-modal');
  crateBox   = document.getElementById('crate-box');
  crateLabel = document.getElementById('crate-label');
  crateReward= document.getElementById('crate-reward');
  crateTier  = null;
}

function bindEvents(cbs) {
  callbacks = cbs;

  // Tab switching
  tabBar.addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });

  // Crate badge in stats bar
  document.getElementById('crate-badge').addEventListener('click', () => {
    openCrateModal(callbacks.getState());
  });

  // Crate modal open box
  crateModal.addEventListener('click', e => {
    if (e.target.id === 'crate-open-btn') {
      performCrateOpen();
    } else if (e.target.id === 'crate-open-all-btn') {
      performOpenAll();
    } else if (e.target.id === 'crate-close') {
      closeCrateModal();
    } else if (e.target.classList.contains('crate-buy-btn')) {
      const tier = e.target.dataset.tier;
      callbacks.onBuyCrate(tier);
      renderCrateModal(callbacks.getState());
    }
  });

  // Delegated events on scroll panel
  scrollPanel.addEventListener('click', e => {
    // Base upgrade
    const baseBtn = e.target.closest('[data-base-section]');
    if (baseBtn) { callbacks.onBuyBaseUpgrade(baseBtn.dataset.baseSection); return; }

    // Aircraft unlock
    const unlockBtn = e.target.closest('[data-unlock]');
    if (unlockBtn) { callbacks.onUnlockAircraft(unlockBtn.dataset.unlock); return; }

    // Aircraft upgrade
    const upgradeBtn = e.target.closest('[data-upgrade]');
    if (upgradeBtn) {
      const [id, slot] = upgradeBtn.dataset.upgrade.split(':');
      callbacks.onUpgradeAircraft(id, parseInt(slot));
      return;
    }

    // Select aircraft in Ops panel
    const acSelect = e.target.closest('[data-select-ac]');
    if (acSelect) { selectedAircraftId = acSelect.dataset.selectAc; renderOpsPanel(callbacks.getState()); return; }

    // Launch mission
    const launchBtn = e.target.closest('[data-launch]');
    if (launchBtn) {
      const [id, mid] = launchBtn.dataset.launch.split(':');
      callbacks.onStartMission(id, mid);
      return;
    }

    // Prestige
    if (e.target.id === 'prestige-btn') { callbacks.onPrestige(); return; }
  });
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  panelBase.style.display    = tab === 'base'    ? 'block' : 'none';
  panelPlanes.style.display  = tab === 'planes'  ? 'block' : 'none';
  panelOps.style.display     = tab === 'ops'     ? 'block' : 'none';
  panelPrestige.style.display= tab === 'prestige'? 'block' : 'none';
}

// ── Render entry point (throttled to 4fps by main.js) ─────────────────────────

function renderUI(st) {
  renderStatsBar(st);
  renderBoostBar(st);
  switch (activeTab) {
    case 'base':    renderBasePanel(st);    break;
    case 'planes':  renderPlanesPanel(st);  break;
    case 'ops':     renderOpsPanel(st);     break;
    case 'prestige':renderPrestigePanel(st);break;
  }
}

// ── Stats bar ──────────────────────────────────────────────────────────────────

function renderStatsBar(st) {
  const now = Date.now();
  let passive = 0;
  for (const a of AIRCRAFT) {
    const ac = st.aircraft[a.id];
    if (ac && ac.currentMission && ac.currentMission.endTime > now) {
      passive += ac.currentMission.passivePerSec;
    }
  }
  const credEl = document.getElementById('stat-credits');
  const rateEl = document.getElementById('stat-rate');
  if (credEl) credEl.textContent = formatCredits(st.credits);
  if (rateEl) rateEl.textContent = formatRate(passive);
  const badge = document.getElementById('crate-badge');
  const count = (st.crateQueue || []).length;
  if (badge) {
    badge.textContent = count > 0 ? `📦 ${count}` : '📦';
    badge.classList.toggle('has-crates', count > 0);
  }
}

// ── Boost bar ─────────────────────────────────────────────────────────────────

function renderBoostBar(st) {
  const now = Date.now();
  const active = (st.activeBoosts || []).filter(b => b.expiresAt > now);
  if (!active.length) { boostBar.innerHTML = ''; return; }
  boostBar.innerHTML = active.map(b => {
    const remaining = Math.ceil((b.expiresAt - now) / 1000);
    const label = b.type === 'income' ? '⚡Income' : b.type === 'payout' ? '💰Payout' : '🚀Speed';
    return `<span class="boost-pill">${label} ×${b.multiplier} ${formatTime(remaining)}</span>`;
  }).join('');
}

// ── BASE panel (Idle Miner style strips) ───────────────────────────────────────

function renderBasePanel(st) {
  const slots = getMaxMissionSlots(st);
  panelBase.innerHTML = `
    <div class="section-header">Base Command <span class="slots-badge">${slots} Mission Slots</span></div>
    ${BASE_SECTIONS.map(section => renderBaseSection(section, st)).join('')}
  `;
}

function renderBaseSection(section, st) {
  const bought = st.baseUpgrades[section.key] || 0;
  const upgrades = section.upgrades;
  return `
    <div class="base-section">
      <div class="base-section-title">${section.icon} ${section.name}</div>
      <div class="base-section-desc">${section.effectDesc}</div>
      <div class="base-upgrades-strip">
        ${upgrades.map((upg, i) => {
          const done = i < bought;
          const next = i === bought;
          const locked = i > bought;
          const canAfford = next && st.credits >= upg.cost;
          let cls = 'upg-box';
          if (done) cls += ' done';
          else if (next && canAfford) cls += ' affordable';
          else if (next) cls += ' next';
          else cls += ' locked';
          return `<div class="${cls}" ${next ? `data-base-section="${section.key}"` : ''} title="${upg.name}\n${upg.desc}">
            ${done ? `<span class="upg-check">✓</span>` : `<span class="upg-num">${i+1}</span>`}
            ${next ? `<span class="upg-cost">${formatCredits(upg.cost)}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="base-section-progress">${bought}/${upgrades.length} purchased</div>
    </div>
  `;
}

// ── PLANES panel ───────────────────────────────────────────────────────────────

function renderPlanesPanel(st) {
  const now = Date.now();
  panelPlanes.innerHTML = AIRCRAFT.map(ac => renderAircraftCard(ac, st, now)).join('');
}

function renderAircraftCard(acDef, st, now) {
  const acState   = st.aircraft[acDef.id];
  const unlocked  = acState && acState.unlocked;
  const onMission = unlocked && acState.currentMission && acState.currentMission.endTime > now;
  const upgrades  = acState ? acState.upgrades : [0,0,0,0,0];

  const dotCls    = onMission ? 'on-mission' : unlocked ? 'ready' : 'locked-s';
  const statusStr = !unlocked
    ? `Locked — ${formatCredits(acDef.unlockCost)}`
    : onMission
      ? `On mission — ${formatTime((acState.currentMission.endTime - now) / 1000)}`
      : 'Ready';

  const progressHtml = onMission ? (() => {
    const m   = acState.currentMission;
    const pct = Math.round(clamp((now - m.startTime) / (m.endTime - m.startTime), 0, 1) * 100);
    return `<div class="mission-progress"><div class="mission-progress-fill" style="width:${pct}%"></div></div>`;
  })() : '';

  const upgradesHtml = acDef.upgradeNames.map((name, i) => {
    const tier      = upgrades[i];
    const maxed     = tier >= 5;
    const cost      = !maxed ? acDef.upgradeCosts[i][tier] : 0;
    const canAfford = !maxed && st.credits >= cost;
    return `<div class="upgrade-row">
      <span class="upg-name">${name}</span>
      <div class="upg-pips">${[0,1,2,3,4].map(p => `<span class="pip ${p < tier ? 'filled' : ''}"></span>`).join('')}</div>
      ${maxed
        ? '<span class="upg-maxed">MAX</span>'
        : `<button class="btn-upg ${canAfford ? '' : 'cant-afford'}" data-upgrade="${acDef.id}:${i}" ${!unlocked || !canAfford ? 'disabled' : ''}>${formatCredits(cost)}</button>`}
    </div>`;
  }).join('');

  return `<div class="ac-card ${!unlocked ? 'locked' : ''}">
    <div class="ac-card-header">
      <canvas class="ac-minicanvas" data-acid="${acDef.id}" width="72" height="72"></canvas>
      <div class="ac-info">
        <div class="ac-name">${acDef.name}</div>
        <div class="ac-role">${acDef.role}</div>
        <div class="ac-status ${onMission ? 'on-mission' : unlocked ? 'ready' : 'locked-status'}">
          <span class="status-dot ${dotCls}"></span>${statusStr}
        </div>
        ${progressHtml}
      </div>
      ${!unlocked ? `<button class="btn-unlock ${st.credits >= acDef.unlockCost ? '' : 'cant-afford'}" data-unlock="${acDef.id}" ${st.credits < acDef.unlockCost ? 'disabled' : ''}>UNLOCK<br>${formatCredits(acDef.unlockCost)}</button>` : ''}
    </div>
    ${unlocked ? `<div class="ac-special">⭐ ${acDef.specialDesc}</div>` : ''}
    ${unlocked ? `<div class="ac-upgrades">${upgradesHtml}</div>` : ''}
  </div>`;
}

// ── OPS panel ─────────────────────────────────────────────────────────────────

function renderOpsPanel(st) {
  const now = Date.now();
  const slots = getMaxMissionSlots(st);
  const used  = AIRCRAFT.filter(a => {
    const ac = st.aircraft[a.id];
    return ac && ac.currentMission && ac.currentMission.endTime > now;
  }).length;

  const acSelector = `<div class="ac-selector">
    ${AIRCRAFT.filter(a => st.aircraft[a.id] && st.aircraft[a.id].unlocked).map(a =>
      `<button class="ac-sel-btn ${selectedAircraftId === a.id ? 'selected' : ''}" data-select-ac="${a.id}">${a.name.split(' ')[0]}</button>`
    ).join('')}
  </div>`;

  const acDef   = getAircraftById(selectedAircraftId);
  const acState = st.aircraft[selectedAircraftId];
  if (!acDef || !acState || !acState.unlocked) {
    panelOps.innerHTML = `<div class="ops-header">Operations — ${used}/${slots} slots active</div>${acSelector}<p class="empty-msg">Select an unlocked aircraft above.</p>`;
    return;
  }

  const missions = getMissionsByAircraft(selectedAircraftId);
  const weaponsTier = acState.upgrades[3] || 0;
  const onMission = acState.currentMission && acState.currentMission.endTime > now;

  const missionCards = missions.map(m => {
    const available = m.tier === 1 || weaponsTier >= 1;
    const dur  = getMissionDuration(selectedAircraftId, m.id, st);
    const pay  = getMissionPayout(selectedAircraftId, m.id, st);
    const pass = getMissionPassive(selectedAircraftId, m.id, st);
    const canLaunch = available && !onMission && used < slots;
    return `<div class="mission-card ${!available ? 'locked-mission' : ''}">
      <div class="mission-name">${m.name}</div>
      <div class="mission-desc">${m.desc}</div>
      <div class="mission-stats">
        <span>⏱ ${formatTime(dur)}</span>
        <span>💰 ${formatCredits(pay)}</span>
        <span>📈 ${formatRate(pass)}</span>
      </div>
      ${!available ? '<div class="mission-locked">Requires Weapons Loadout upgrade</div>' :
        `<button class="btn-launch ${canLaunch ? '' : 'cant-afford'}" data-launch="${selectedAircraftId}:${m.id}" ${!canLaunch ? 'disabled' : ''}>Launch</button>`}
    </div>`;
  }).join('');

  let activeInfo = '';
  if (onMission) {
    const m       = acState.currentMission;
    const timeLeft = Math.max(0, (m.endTime - now) / 1000);
    const pct     = Math.round(clamp((now - m.startTime) / (m.endTime - m.startTime), 0, 1) * 100);
    activeInfo = `<div class="active-mission-banner">
      <div class="mission-banner-top">
        <span class="mission-banner-text"><span class="status-dot on-mission"></span>✈ ${formatTime(timeLeft)} remaining</span>
        <span class="mission-banner-rate">${formatRate(m.passivePerSec)}</span>
      </div>
      <div class="mission-progress"><div class="mission-progress-fill" style="width:${pct}%"></div></div>
    </div>`;
  }

  panelOps.innerHTML = `
    <div class="ops-header">Operations — ${used}/${slots} slots active</div>
    ${acSelector}
    ${activeInfo}
    <div class="mission-grid">${missionCards}</div>
  `;
}

// ── PRESTIGE panel ────────────────────────────────────────────────────────────

function renderPrestigePanel(st) {
  const { prestigeThreshold } = callbacks;
  const threshold = prestigeThreshold();
  const progress  = Math.min(1, st.totalCreditsEarned / threshold);
  const pct = Math.round(progress * 100);
  const stars = st.prestigeStars;
  const multiplier = 1 + stars * 0.25;
  const canPrestige = st.totalCreditsEarned >= threshold;

  panelPrestige.innerHTML = `
    <div class="prestige-section">
      <div class="prestige-stars">${'⭐'.repeat(Math.min(stars, 20))} ${stars > 0 ? `×${stars}` : ''}</div>
      <div class="prestige-multi">Income Multiplier: <strong>×${multiplier.toFixed(2)}</strong></div>
      <div class="prestige-label">Total Credits Earned</div>
      <div class="prestige-bar-wrap">
        <div class="prestige-bar" style="width:${pct}%"></div>
      </div>
      <div class="prestige-numbers">${formatCredits(st.totalCreditsEarned)} / ${formatCredits(threshold)}</div>
      <button id="prestige-btn" class="btn-prestige ${canPrestige ? '' : 'cant-afford'}" ${canPrestige ? '' : 'disabled'}>
        ${canPrestige ? '🌟 Prestige Now' : `Prestige (${pct}%)`}
      </button>
      ${stars > 0 ? `<div class="prestige-info">Each prestige resets credits but keeps all upgrades.<br>Income ×${(1 + (stars+1) * 0.25).toFixed(2)} after next prestige.</div>` : `<div class="prestige-info">Prestige resets credits but keeps all aircraft and base upgrades. Earn a permanent income multiplier.</div>`}
    </div>
    <div class="prestige-section">
      <div class="base-section-title">Buy Crates</div>
      ${['common','rare','epic'].map(tier => {
        const info = CRATE_COLORS[tier];
        const cost = CRATE_COSTS[tier];
        return `<button class="crate-buy-btn tier-${tier} ${st.credits >= cost ? '' : 'cant-afford'}" data-tier="${tier}" ${st.credits < cost ? 'disabled' : ''}>
          ${info.label} — ${formatCredits(cost)}
        </button>`;
      }).join('')}
    </div>
  `;
}

// ── Crate modal ───────────────────────────────────────────────────────────────

function openCrateModal(st) {
  if (!st.crateQueue || !st.crateQueue.length) return;
  crateModal.style.display = 'flex';
  crateResult = null;
  renderCrateModal(st);
}

function renderCrateModal(st) {
  const count = (st.crateQueue || []).length;
  if (!count && !crateResult) { closeCrateModal(); return; }
  const tier = crateResult ? crateResult.tier : (st.crateQueue[0] || 'common');
  const info = CRATE_COLORS[tier];

  crateModal.querySelector('.crate-modal-inner').innerHTML = `
    <button id="crate-close" class="crate-close">✕</button>
    <div class="crate-title" style="color:${info.border}">${info.label}</div>
    <div class="crate-box-wrap">
      <div id="crate-box" class="crate-box ${crateAnimating ? 'shaking' : ''}" style="border-color:${info.border};box-shadow:0 0 24px ${info.glow}">
        ${crateResult
          ? `<div class="crate-reward-text" style="color:${info.border}">${crateResult.reward.label}</div>`
          : `<div class="crate-icon">📦</div>`}
      </div>
    </div>
    ${crateResult
      ? `<button id="crate-open-btn" class="btn-crate-open" style="border-color:${info.border}">
           ${count > 0 ? 'Open Next' : 'Done'}
         </button>`
      : `<button id="crate-open-btn" class="btn-crate-open" style="border-color:${info.border}">Tap to Open</button>`}
    ${count > 1 ? `<button id="crate-open-all-btn" class="btn-crate-all">Open All (${count})</button>` : ''}
  `;
}

function performCrateOpen() {
  crateResult = callbacks.onOpenCrate();
  if (!crateResult) { closeCrateModal(); return; }
  crateAnimating = true;
  renderCrateModal(callbacks.getState());
  setTimeout(() => { crateAnimating = false; }, 400);
}

function performOpenAll() {
  let last = null;
  const st = callbacks.getState();
  const count = st.crateQueue.length;
  for (let i = 0; i < count; i++) {
    last = callbacks.onOpenCrate();
  }
  crateResult = last;
  renderCrateModal(callbacks.getState());
}

function closeCrateModal() {
  crateModal.style.display = 'none';
  crateResult = null;
  crateAnimating = false;
}

// Draw aircraft silhouettes into mini canvases in the Planes panel
function drawMiniCanvases() {
  document.querySelectorAll('.ac-minicanvas').forEach(mc => {
    const id    = mc.dataset.acid;
    const acDef = getAircraftById(id);
    if (!acDef) return;
    const _dpr  = Math.min(window.devicePixelRatio || 1, 2.5);
    const size  = mc.getBoundingClientRect().width || 72;
    mc.width  = Math.round(size * _dpr);
    mc.height = Math.round(size * _dpr);
    const c   = mc.getContext('2d');
    c.scale(_dpr, _dpr);
    c.clearRect(0, 0, size, size);
    // Dark gradient background
    const bg = c.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, '#0a180a');
    bg.addColorStop(1, '#0e200e');
    c.fillStyle = bg;
    c.fillRect(0, 0, size, size);
    const sc = size * 0.46;
    const cx = size / 2;
    const cy = size / 2;
    c.shadowBlur  = 14;
    c.shadowColor = acDef.color;
    for (const part of acDef.parts) {
      c.save();
      c.globalAlpha = part.alpha !== undefined ? part.alpha : 1;
      c.beginPath();
      c.moveTo(cx + part.points[0][0] * sc, cy + part.points[0][1] * sc);
      for (let i = 1; i < part.points.length; i++) {
        c.lineTo(cx + part.points[i][0] * sc, cy + part.points[i][1] * sc);
      }
      c.closePath();
      c.fillStyle = part.color;
      c.fill();
      c.restore();
    }
  });
}


// ── src/main.js ──





let lastTs = 0;
let lastUIUpdate = 0;
let lastSave = 0;

async function init() {
  loadState();
  applyOfflineEarnings();

  const canvas = document.getElementById('game-canvas');
  initRenderer(canvas);
  initUI();

  bindEvents({
    getState: () => state,
    prestigeThreshold,
    onStartMission: (aircraftId, missionId) => {
      if (startMission(aircraftId, missionId)) renderUI(state);
    },
    onUpgradeAircraft: (aircraftId, slotIndex) => {
      if (upgradeAircraft(aircraftId, slotIndex)) renderUI(state);
    },
    onUnlockAircraft: (aircraftId) => {
      if (unlockAircraft(aircraftId)) renderUI(state);
    },
    onBuyBaseUpgrade: (sectionKey) => {
      if (buyBaseUpgrade(sectionKey)) renderUI(state);
    },
    onPrestige: () => {
      if (prestige()) renderUI(state);
    },
    onOpenCrate: () => {
      const result = openNextCrate();
      if (result) {
        handlePendingActions();
        renderUI(state);
      }
      return result;
    },
    onBuyCrate: (tier) => {
      if (buyCrate(tier)) renderUI(state);
    },
  });

  renderUI(state);
  requestAnimationFrame(gameLoop);

  setInterval(() => saveState(), 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      saveState();
    } else {
      applyOfflineEarnings();
      renderUI(state);
    }
  });

  registerSW();
}

function gameLoop(ts) {
  const dt = Math.min((ts - (lastTs || ts)) / 1000, 0.1);
  lastTs = ts;

  tick(dt, ts);

  renderFrame(state, ts, dt);

  if (ts - lastUIUpdate > 250) {
    renderUI(state);
    drawMiniCanvases();
    lastUIUpdate = ts;
  }

  requestAnimationFrame(gameLoop);
}

function tick(dt, ts) {
  pruneExpiredBoosts();

  const now = Date.now();

  for (const ac of AIRCRAFT) {
    const acState = state.aircraft[ac.id];
    if (!acState || !acState.currentMission) continue;
    const m = acState.currentMission;

    if (m.endTime <= now) {
      const payout = m.payoutOnComplete;
      completeMission(ac.id);
      triggerCompletionFlash(ac.id, payout);
      handlePendingActions();
    } else {
      // Drip passive income
      addCredits(m.passivePerSec * dt);
    }
  }

  state.lastTick = now;
}

function handlePendingActions() {
  if (state._pendingInstantComplete) {
    const target = state._pendingInstantComplete;
    state._pendingInstantComplete = null;
    const now = Date.now();
    for (const ac of AIRCRAFT) {
      const acState = state.aircraft[ac.id];
      if (!acState || !acState.currentMission) continue;
      if (target === 'all' || target > 0) {
        acState.currentMission.endTime = now - 1;
      }
      if (typeof target === 'number' && target > 0) break;
    }
  }

  if (state._pendingUnlockNext) {
    state._pendingUnlockNext = false;
    for (const ac of AIRCRAFT) {
      const acState = state.aircraft[ac.id];
      if (acState && !acState.unlocked) {
        acState.unlocked = true;
        break;
      }
    }
  }
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('./service-worker.js', { scope: './' });
  } catch {}
}

init();

})();
