<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a140a">
  <title>AirCommand</title>
  <style>
:root {
  --bg: #0a140a;
  --bg-panel: #0f1d0f;
  --bg-card: #162016;
  --bg-card2: #1a2a1a;
  --accent: #4ade80;
  --accent-dim: #22c55e;
  --warn: #facc15;
  --danger: #ef4444;
  --text: #d1fae5;
  --text-muted: #6b7280;
  --border: #2d4a2d;
  --border-bright: #3d6a3d;
  --radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Layout ──────────────────────────────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right);
}

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
#tab-bar {
  display: flex;
  background: #050e05;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

#tab-bar button {
  flex: 1;
  padding: 10px 4px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: inherit;
  font-size: 11px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  cursor: pointer;
  transition: color 0.15s, border-bottom 0.15s;
  border-bottom: 2px solid transparent;
  min-height: 44px;
}

#tab-bar button.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* ── Stats bar ───────────────────────────────────────────────────────────── */
#stats-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 12px;
  background: #081008;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  min-height: 38px;
}

.stat-credits { font-size: 18px; font-weight: bold; color: var(--accent); }
.stat-rate    { font-size: 12px; color: var(--text-muted); }

#crate-badge {
  background: #162016;
  border: 1px solid var(--border);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.2s;
  min-height: 32px;
}

#crate-badge.has-crates {
  border-color: var(--warn);
  color: var(--warn);
  box-shadow: 0 0 10px rgba(250,204,21,0.3);
  animation: pulse-badge 1.5s ease-in-out infinite;
}

@keyframes pulse-badge {
  0%,100% { box-shadow: 0 0 8px rgba(250,204,21,0.3); }
  50%      { box-shadow: 0 0 18px rgba(250,204,21,0.6); }
}

/* ── Boost bar ───────────────────────────────────────────────────────────── */
#boost-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 4px 8px;
  background: #060d06;
  flex-shrink: 0;
  min-height: 0;
}

.boost-pill {
  font-size: 11px;
  background: #1a2a0a;
  border: 1px solid var(--accent-dim);
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 20px;
}

/* ── Canvas ──────────────────────────────────────────────────────────────── */
#canvas-wrap {
  flex-shrink: 0;
  height: 36vh;
  min-height: 160px;
  max-height: 260px;
  background: #080f08;
  border-bottom: 1px solid var(--border);
  position: relative;
}

#game-canvas {
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ── Scroll panel ────────────────────────────────────────────────────────── */
#scroll-panel {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  background: var(--bg-panel);
}

/* ── Section header ──────────────────────────────────────────────────────── */
.section-header {
  padding: 10px 14px 6px;
  font-size: 13px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.slots-badge {
  background: var(--bg-card);
  color: var(--accent);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid var(--border-bright);
}

/* ── BASE panel ──────────────────────────────────────────────────────────── */
.base-section {
  border-bottom: 1px solid var(--border);
  padding: 10px 12px;
}

.base-section-title {
  font-size: 13px;
  color: var(--accent);
  margin-bottom: 2px;
  font-weight: bold;
}

.base-section-desc {
  font-size: 11px;
  color: var(--text-muted);
  margin-bottom: 8px;
}

.base-upgrades-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}

.base-upgrades-strip::-webkit-scrollbar { display: none; }

.upg-box {
  flex-shrink: 0;
  width: 52px;
  height: 52px;
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  cursor: pointer;
  border: 1px solid;
  transition: all 0.15s;
  position: relative;
}

.upg-box.done {
  background: var(--bg-card2);
  border-color: var(--accent-dim);
  cursor: default;
}

.upg-box.affordable {
  background: #1a3a1a;
  border-color: var(--accent);
  box-shadow: 0 0 10px rgba(74,222,128,0.3);
}

.upg-box.affordable:active { transform: scale(0.95); }

.upg-box.next {
  background: var(--bg-card);
  border-color: var(--warn);
  border-style: dashed;
}

.upg-box.locked {
  background: #0a100a;
  border-color: #1a2a1a;
  opacity: 0.5;
  cursor: default;
}

.upg-check { font-size: 18px; color: var(--accent-dim); }
.upg-num   { font-size: 14px; color: var(--text-muted); }
.upg-cost  { font-size: 9px;  color: var(--warn); text-align: center; line-height: 1; }

.base-section-progress {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 6px;
}

/* ── PLANES panel ────────────────────────────────────────────────────────── */
.ac-card {
  border-bottom: 1px solid var(--border);
  padding: 12px;
  background: var(--bg-panel);
}

.ac-card.locked { opacity: 0.75; }

.ac-card-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.ac-minicanvas {
  width: 56px;
  height: 56px;
  border-radius: var(--radius);
  background: #0a180a;
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.ac-info { flex: 1; min-width: 0; }
.ac-name { font-size: 14px; font-weight: bold; color: var(--text); }
.ac-role { font-size: 11px; color: var(--text-muted); margin: 2px 0; }
.ac-status { font-size: 11px; }
.ac-status.ready       { color: var(--accent); }
.ac-status.on-mission  { color: var(--warn); }
.ac-status.locked-status { color: var(--danger); }

.ac-special {
  font-size: 11px;
  color: #a78bfa;
  background: #1a1a2a;
  border: 1px solid #3a3a5a;
  border-radius: var(--radius);
  padding: 4px 8px;
  margin-bottom: 8px;
}

.ac-upgrades { display: flex; flex-direction: column; gap: 5px; }

.upgrade-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.upg-name { flex: 1; font-size: 11px; color: var(--text-muted); }

.upg-pips { display: flex; gap: 3px; }

.pip {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid var(--border-bright);
  background: transparent;
}

.pip.filled { background: var(--accent); border-color: var(--accent); }

.upg-maxed { font-size: 10px; color: var(--accent); padding: 2px 6px; }

.btn-upg {
  font-family: inherit;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: #1a3a1a;
  color: var(--accent);
  cursor: pointer;
  min-height: 28px;
  min-width: 44px;
}

.btn-upg:active { transform: scale(0.95); }

.btn-unlock {
  font-family: inherit;
  font-size: 11px;
  padding: 6px 10px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: #1a3a1a;
  color: var(--accent);
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
  min-height: 44px;
}

/* ── OPS panel ───────────────────────────────────────────────────────────── */
.ops-header {
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.ac-selector {
  display: flex;
  overflow-x: auto;
  gap: 6px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}

.ac-selector::-webkit-scrollbar { display: none; }

.ac-sel-btn {
  flex-shrink: 0;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  min-height: 34px;
  white-space: nowrap;
}

.ac-sel-btn.selected {
  border-color: var(--accent);
  color: var(--accent);
  background: #1a3a1a;
}

.active-mission-banner {
  margin: 8px 12px;
  padding: 8px 12px;
  background: #1a2a0a;
  border: 1px solid var(--accent-dim);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--accent);
}

.mission-grid {
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.mission-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px;
}

.mission-card.locked-mission { opacity: 0.5; }

.mission-name { font-size: 13px; font-weight: bold; margin-bottom: 3px; }
.mission-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }

.mission-stats {
  display: flex;
  gap: 10px;
  font-size: 11px;
  color: var(--accent);
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.mission-locked { font-size: 11px; color: var(--danger); }

.btn-launch {
  width: 100%;
  padding: 8px;
  background: #1a3a1a;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  min-height: 44px;
}

.btn-launch:active { transform: scale(0.98); }

/* ── PRESTIGE panel ──────────────────────────────────────────────────────── */
.prestige-section {
  padding: 16px;
  border-bottom: 1px solid var(--border);
}

.prestige-stars { font-size: 24px; margin-bottom: 6px; }
.prestige-multi { font-size: 14px; color: var(--text); margin-bottom: 12px; }
.prestige-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }

.prestige-bar-wrap {
  height: 8px;
  background: var(--bg-card2);
  border-radius: 4px;
  overflow: hidden;
  margin-bottom: 6px;
}

.prestige-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.4s ease;
}

.prestige-numbers { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

.btn-prestige {
  display: block;
  width: 100%;
  padding: 14px;
  background: #1a2a0a;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  min-height: 52px;
  margin-bottom: 10px;
}

.prestige-info {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
}

.crate-buy-btn {
  display: block;
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  background: var(--bg-card);
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  min-height: 44px;
}

.crate-buy-btn.tier-common { border: 1px solid var(--accent); color: var(--accent); }
.crate-buy-btn.tier-rare   { border: 1px solid #60a5fa; color: #60a5fa; }
.crate-buy-btn.tier-epic   { border: 1px solid var(--warn); color: var(--warn); }

/* ── Shared disabled/can't afford ────────────────────────────────────────── */
.cant-afford {
  opacity: 0.45;
  cursor: not-allowed;
}

button:disabled { cursor: not-allowed; opacity: 0.4; }

.empty-msg {
  padding: 20px;
  color: var(--text-muted);
  text-align: center;
  font-size: 13px;
}

/* ── Crate modal ─────────────────────────────────────────────────────────── */
#crate-modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
}

.crate-modal-inner {
  background: #0d1a0d;
  border: 1px solid var(--border-bright);
  border-bottom: none;
  border-radius: 20px 20px 0 0;
  width: 100%;
  max-width: 480px;
  padding: 20px 20px 32px;
  padding-bottom: calc(32px + env(safe-area-inset-bottom));
  position: relative;
  min-height: 320px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.crate-close {
  position: absolute;
  top: 14px; right: 14px;
  background: none; border: none;
  color: var(--text-muted);
  font-size: 20px;
  cursor: pointer;
  min-height: 32px;
  min-width: 32px;
}

.crate-title {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.crate-box-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }

.crate-box {
  width: 140px;
  height: 140px;
  border-radius: 16px;
  border: 3px solid;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a180a;
}

.crate-box.shaking {
  animation: shake 0.4s ease;
}

@keyframes shake {
  0%,100%{transform:translateX(0) rotate(0)}
  20%{transform:translateX(-8px) rotate(-5deg)}
  40%{transform:translateX(8px) rotate(5deg)}
  60%{transform:translateX(-5px) rotate(-3deg)}
  80%{transform:translateX(5px) rotate(3deg)}
}

.crate-icon { font-size: 56px; }

.crate-reward-text {
  font-size: 14px;
  font-weight: bold;
  text-align: center;
  line-height: 1.4;
  padding: 8px;
}

.btn-crate-open {
  width: 100%;
  padding: 14px;
  border-radius: var(--radius);
  background: #1a3a1a;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  min-height: 52px;
}

.btn-crate-all {
  width: 100%;
  padding: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--border-bright);
  background: var(--bg-card);
  color: var(--text-muted);
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  min-height: 44px;
}

/* ── Scrollbar ───────────────────────────────────────────────────────────── */
#scroll-panel::-webkit-scrollbar { width: 3px; }
#scroll-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  </style>
</head>
<body>
<div id="app">
  <nav id="tab-bar">
    <button data-tab="base" class="active">Base</button>
    <button data-tab="planes">Planes</button>
    <button data-tab="ops">Ops</button>
    <button data-tab="prestige">&#9733; Prestige</button>
  </nav>
  <div id="stats-bar">
    <div>
      <div class="stat-credits" id="stat-credits">0</div>
      <div class="stat-rate"    id="stat-rate">+0/s</div>
    </div>
    <button id="crate-badge">&#128230;</button>
  </div>
  <div id="boost-bar"></div>
  <div id="canvas-wrap">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="scroll-panel">
    <div id="panel-base"></div>
    <div id="panel-planes"   style="display:none"></div>
    <div id="panel-ops"      style="display:none"></div>
    <div id="panel-prestige" style="display:none"></div>
  </div>
</div>
<div id="crate-modal">
  <div class="crate-modal-inner"></div>
</div>
<script>
(function() {
'use strict';
// ── src/utils.js ──
function formatCredits(n) {
  if (n >= 1e12) return (n / 1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3)  return (n / 1e3).toFixed(1) + 'K';
  return Math.floor(n).toString();
}

function formatRate(perSec) {
  if (perSec <= 0) return '+0/s';
  return '+' + formatCredits(perSec) + '/s';
}

function formatTime(seconds) {
  seconds = Math.max(0, Math.ceil(seconds));
  if (seconds >= 3600) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return `${h}h ${m}m`;
  }
  if (seconds >= 60) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return `${m}m ${s}s`;
  }
  return `${seconds}s`;
}

function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }
function randomBetween(min, max) { return min + Math.random() * (max - min); }
function randomInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }

function weightedRandom(items) {
  // items: [{weight, value}]
  const total = items.reduce((s, i) => s + i.weight, 0);
  let r = Math.random() * total;
  for (const item of items) {
    r -= item.weight;
    if (r <= 0) return item.value;
  }
  return items[items.length - 1].value;
}

function getArcPoint(x1, y1, x2, y2, t, bend = 0.28) {
  const mx = (x1 + x2) / 2;
  const my = (y1 + y2) / 2;
  const dx = x2 - x1;
  const dy = y2 - y1;
  const cx = mx - dy * bend;
  const cy = my + dx * bend;
  const it = 1 - t;
  return {
    x: it*it*x1 + 2*it*t*cx + t*t*x2,
    y: it*it*y1 + 2*it*t*cy + t*t*y2
  };
}

function deepMerge(target, source) {
  const result = { ...target };
  for (const key of Object.keys(source)) {
    if (source[key] !== null && typeof source[key] === 'object' && !Array.isArray(source[key])) {
      result[key] = deepMerge(target[key] || {}, source[key]);
    } else if (result[key] === undefined) {
      result[key] = source[key];
    }
  }
  return result;
}


// ── src/aircraft.js ──
// Top-down silhouettes. Coords: nose at y=-0.5, tail at y=+0.5, wings on x-axis.
// Each part: { points:[[x,y],...], color:'#hex', alpha?:0-1 }

const AIRCRAFT = [
  {
    id: 'ac130', name: 'AC-130 Gunship', role: 'Close Air Support',
    unlockCost: 0, basePassivePerSec: 1.2,
    upgradeNames: ['Airframe', 'Crew Training', 'Avionics', 'Weapons Loadout', 'Gunship Mk.II'],
    specialDesc: 'Loiter Bonus: +50% passive when another aircraft is in the same zone',
    upgradeCosts: [
      [200,600,1500,4000,10000],
      [150,450,1200,3000,8000],
      [300,900,2200,5500,14000],
      [400,1200,3000,7500,20000],
      [1000,3000,8000,20000,50000]
    ],
    color: '#5a7a3a',
    parts: [
      { points:[[0,-0.38],[0.08,-0.3],[0.09,0.28],[0.06,0.42],[0,0.45],[-0.06,0.42],[-0.09,0.28],[-0.08,-0.3]], color:'#5a7a3a' },
      { points:[[0.09,-0.05],[0.48,-0.02],[0.48,0.12],[0.09,0.1]], color:'#4a6a2a' },
      { points:[[-0.09,-0.05],[-0.48,-0.02],[-0.48,0.12],[-0.09,0.1]], color:'#4a6a2a' },
      { points:[[0.14,0.0],[0.22,0.0],[0.22,0.1],[0.14,0.1]], color:'#3a5a1a' },

function getMissionsByAircraft(id) {
  return MISSIONS[id] || [];
}

function getMission(aircraftId, missionId) {
  return (MISSIONS[aircraftId] || []).find(m => m.id === missionId);
}

function getMissionDuration(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const crewTier = ac ? ac.upgrades[1] : 0;
  const crewBonus = 1 - crewTier * 0.1;

  // Building bonuses
  const fuelBonus = 1 - (state.baseUpgrades.fuel || 0) * 0.05;
  const intelBonus = 1 - (state.baseUpgrades.command || 0) * 0.03;

  // KC-135 tanker bonus
  const kc135 = state.aircraft.kc135;
  const tankerBonus = (kc135 && kc135.currentMission) ? 0.85 : 1;

  return Math.round(m.duration * crewBonus * fuelBonus * intelBonus * tankerBonus);
}

function getMissionPayout(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const avionicsTier = ac ? ac.upgrades[2] : 0;
  const avionicsBonus = 1 + avionicsTier * 0.15;

  const armBonus = 1 + (state.baseUpgrades.armaments || 0) * 0.08;
  const cmdBonus = 1 + (state.baseUpgrades.command || 0) * 0.04;

  const prestigeBonus = 1 + (state.prestigeStars || 0) * 0.25;

  // E-3 force multiplier
  const e3 = state.aircraft.e3;
  const e3Bonus = (e3 && e3.currentMission) ? 1.3 : 1;

  // Payout boost from active boosts
  const now = Date.now();
  const payoutBoost = (state.activeBoosts || [])
    .filter(b => b.type === 'payout' && b.expiresAt > now)
    .reduce((acc, b) => acc * b.multiplier, 1);

  return Math.round(m.payout * avionicsBonus * armBonus * cmdBonus * prestigeBonus * e3Bonus * payoutBoost);
}

function getMissionPassive(aircraftId, missionId, state) {
  const m = getMission(aircraftId, missionId);
  if (!m) return 0;
  const ac = state.aircraft[aircraftId];
  const airframeTier = ac ? ac.upgrades[0] : 0;
  const airframeBonus = 1 + airframeTier * 0.20;

  const airfieldBonus = 1 + (state.baseUpgrades.airfield || 0) * 0.05;
  const fuelBonus = 1 + (state.baseUpgrades.fuel || 0) * 0.02;
  const cmdBonus = 1 + (state.baseUpgrades.command || 0) * 0.04;

  const prestigeBonus = 1 + (state.prestigeStars || 0) * 0.25;

  const e3 = state.aircraft.e3;
  const e3Bonus = (e3 && e3.currentMission) ? 1.3 : 1;

  const now = Date.now();
  const incomeBoost = (state.activeBoosts || [])
    .filter(b => b.type === 'income' && b.expiresAt > now)
    .reduce((acc, b) => acc * b.multiplier, 1);

  return m.passive * airframeBonus * airfieldBonus * fuelBonus * cmdBonus * prestigeBonus * e3Bonus * incomeBoost;
}

const LOOT_TABLES = {
  common: [
    { weight: 60, value: () => ({ type:'credits', amount: randomInt(1000, 5000), label: null }) },
    { weight: 20, value: () => ({ type:'boost', kind:'income',  multiplier:1.5, duration:30*60*1000, label:null }) },

  ],
  rare: [
    { weight: 50, value: () => ({ type:'credits', amount: randomInt(10000, 40000), label:null }) },
    { weight: 20, value: () => ({ type:'boost', kind:'income',  multiplier:2.0, duration:60*60*1000, label:null }) },
    { weight: 15, value: () => ({ type:'boost', kind:'payout',  multiplier:2.0, duration:60*60*1000, label:null }) },
    { weight: 10, value: () => ({ type:'instant_complete', count:'all', label:null }) },
    { weight:  5, value: () => ({ type:'crates', count:2, tier:'common', label:null }) },
  ],
  epic: [
    { weight: 40, value: () => ({ type:'credits', amount: randomInt(80000, 200000), label:null }) },
    { weight: 20, value: () => ({ type:'boost', kind:'income',  multiplier:3.0, duration:2*60*60*1000, label:null }) },
    { weight: 15, value: () => ({ type:'boost', kind:'payout',  multiplier:3.0, duration:2*60*60*1000, label:null }) },
    { weight: 15, value: () => ({ type:'prestige_bonus', stars:1, label:null }) },
    { weight: 10, value: () => ({ type:'unlock_next', label:null }) },
  ],
};

const CRATE_COSTS = { common: 500, rare: 5000, epic: 50000 };

const CRATE_COLORS = {
  common: { bg:'#1a3a1a', border:'#4ade80', glow:'rgba(74,222,128,0.4)', label:'SUPPLY CRATE' },
  rare:   { bg:'#1a1a3a', border:'#60a5fa', glow:'rgba(96,165,250,0.4)', label:'RARE CRATE' },
  epic:   { bg:'#2a1a0a', border:'#fbbf24', glow:'rgba(251,191,36,0.5)',  label:'EPIC CRATE' },
};

function rollCrate(tier) {
  const table = LOOT_TABLES[tier];
  const roller = weightedRandom(table);
  const reward = roller();
  reward.label = formatRewardLabel(reward);
  return reward;
}

function formatRewardLabel(reward) {
  switch (reward.type) {
    case 'credits':
      return `+${Math.round(reward.amount).toLocaleString()} Credits`;
    case 'boost':
      const mins = Math.round(reward.duration / 60000);
      const name = reward.kind === 'income' ? 'Income' : reward.kind === 'payout' ? 'Payout' : 'Speed';
      return `${name} ×${reward.multiplier} for ${mins}m`;
    case 'instant_complete':
      return reward.count === 'all' ? 'Complete All Missions!' : 'Instant Mission Complete ×1';
    case 'crates':
      return `+${reward.count} Crates!`;
    case 'prestige_bonus':
      return `+${reward.stars} Prestige Star!`;
    case 'unlock_next':
      return 'Unlock Next Aircraft Free!';
    default:
      return 'Mystery Reward';
  }
}

// Called on mission completion — returns tier to queue, or null
function rollMissionCrateDrop(totalMissions) {
  // Milestone guarantees
  if (totalMissions % 50 === 0) return 'epic';
  if (totalMissions % 10 === 0) return 'rare';
  // Random drop
  const r = Math.random();
  if (r < 0.01) return 'epic';
  if (r < 0.06) return 'rare';
  if (r < 0.22) return 'common';
  return null;
}

function applyReward(reward, state) {
  const now = Date.now();
  switch (reward.type) {
    case 'credits':
      state.credits += reward.amount;
      state.totalCreditsEarned += reward.amount;
      break;
    case 'boost':
      // Stack or extend existing boost of same kind
      const existing = state.activeBoosts.find(b => b.type === reward.kind && b.multiplier === reward.multiplier);
      if (existing) {
        existing.expiresAt = Math.max(existing.expiresAt, now) + reward.duration;
      } else {
        state.activeBoosts.push({ type: reward.kind, multiplier: reward.multiplier, expiresAt: now + reward.duration });
      }
      break;
    case 'instant_complete':
      // Flag for main.js to handle
      state._pendingInstantComplete = reward.count;
      break;
    case 'crates':
      for (let i = 0; i < reward.count; i++) {
        state.crateQueue.push(reward.tier);
      }
      break;
    case 'prestige_bonus':
      state.prestigeStars += reward.stars;
      break;
    case 'unlock_next':
      state._pendingUnlockNext = true;
      break;
  }
}

const SAVE_KEY = 'MILGAME_STATE';
const SCHEMA_VERSION = 2;

function defaultAircraftState(id) {
  return { unlocked: id === 'ac130' || id === 'a10', upgrades: [0,0,0,0,0], currentMission: null, cooldownUntil: 0, totalMissionsFlown: 0 };
}

const DEFAULT_STATE = {
  version: SCHEMA_VERSION,
  lastSave: 0,
  lastTick: 0,
  credits: 500,
  prestigeStars: 0,
  totalCreditsEarned: 500,
  totalMissionsCompleted: 0,
  aircraft: Object.fromEntries(AIRCRAFT.map(a => [a.id, defaultAircraftState(a.id)])),
  baseUpgrades: { airfield: 0, fuel: 0, armaments: 0, personnel: 0, command: 0 },
  sr71Zones: [],
  activeBoosts: [],
  crateQueue: [],
  totalCratesOpened: 0,
  _pendingInstantComplete: null,
  _pendingUnlockNext: false,
  settings: { animationsEnabled: true },
};

let state = structuredClone(DEFAULT_STATE);

function migrateState(raw) {
  if (!raw || typeof raw !== 'object') return structuredClone(DEFAULT_STATE);
  const merged = deepMerge(structuredClone(DEFAULT_STATE), raw);
  // Ensure all aircraft entries exist
  for (const a of AIRCRAFT) {
    if (!merged.aircraft[a.id]) merged.aircraft[a.id] = defaultAircraftState(a.id);
    if (!Array.isArray(merged.aircraft[a.id].upgrades)) merged.aircraft[a.id].upgrades = [0,0,0,0,0];
  }
  merged.version = SCHEMA_VERSION;
  return merged;
}

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
    state = migrateState(raw);
  } catch {
    state = structuredClone(DEFAULT_STATE);
  }
}

function saveState() {
  state.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch {}
}

function applyOfflineEarnings() {
  const now = Date.now();
  const elapsed = (now - (state.lastTick || now)) / 1000; // seconds
  if (elapsed <= 0) { state.lastTick = now; return; }

  for (const ac of AIRCRAFT) {
    const acState = state.aircraft[ac.id];
    if (!acState || !acState.currentMission) continue;
    const m = acState.currentMission;

    if (m.endTime <= now) {
      // Mission completed while offline
      addCredits(m.payoutOnComplete);
      acState.totalMissionsFlown++;
      state.totalMissionsCompleted++;
      const drop = rollMissionCrateDrop(state.totalMissionsCompleted);
      if (drop) state.crateQueue.push(drop);
      acState.currentMission = null;
      acState.cooldownUntil = 0;
    } else {
      // Still in progress — credit passive income up to now
      const passiveSecs = Math.min(elapsed, (m.endTime - (state.lastTick || now)) / 1000);
      if (passiveSecs > 0) addCredits(m.passivePerSec * passiveSecs);
    }
  }
  state.lastTick = now;
}

// ── Computed helpers ──────────────────────────────────────────────────────────

function getActiveMissionCount() {
  return AIRCRAFT.filter(a => {
    const ac = state.aircraft[a.id];
    return ac && ac.currentMission && ac.currentMission.endTime > Date.now();
  }).length;
}

function canStartMission() {
  return getActiveMissionCount() < getMaxMissionSlots(state);
}

function getTotalPassiveRate() {
  const now = Date.now();
  return AIRCRAFT.reduce((sum, a) => {
    const ac = state.aircraft[a.id];
    if (!ac || !ac.currentMission || ac.currentMission.endTime <= now) return sum;
    return sum + ac.currentMission.passivePerSec;
  }, 0);
}

// ── Mutations ─────────────────────────────────────────────────────────────────

function addCredits(amount) {
  state.credits += amount;
  state.totalCreditsEarned += amount;
}

function spendCredits(amount) {
  if (state.credits < amount) return false;
  state.credits -= amount;
  return true;
}

function startMission(aircraftId, missionId) {
  const acState = state.aircraft[aircraftId];
  if (!acState || !acState.unlocked) return false;
  if (acState.currentMission) return false;
  if (!canStartMission()) return false;

  const dur = getMissionDuration(aircraftId, missionId, state);
  const payout = getMissionPayout(aircraftId, missionId, state);
  const passive = getMissionPassive(aircraftId, missionId, state);
  const now = Date.now();

  acState.currentMission = {
    missionId,
    startTime: now,
    endTime: now + dur * 1000,
    payoutOnComplete: payout,
    passivePerSec: passive,
  };
  return true;
}

function completeMission(aircraftId) {
  const acState = state.aircraft[aircraftId];
  if (!acState || !acState.currentMission) return;
  addCredits(acState.currentMission.payoutOnComplete);
  acState.totalMissionsFlown++;
  state.totalMissionsCompleted++;

  // SR-71 zone unlock
  if (aircraftId === 'sr71') {
    const zones = ['zone_alpha','zone_bravo','zone_charlie','zone_delta','zone_echo'];
    for (const z of zones) {
      if (!state.sr71Zones.includes(z)) { state.sr71Zones.push(z); break; }
    }
  }

  const drop = rollMissionCrateDrop(state.totalMissionsCompleted);
  if (drop) state.crateQueue.push(drop);

  acState.currentMission = null;
  acState.cooldownUntil = 0;
}

function upgradeAircraft(aircraftId, slotIndex) {
  const acState = state.aircraft[aircraftId];
  const acDef   = AIRCRAFT.find(a => a.id === aircraftId);
  if (!acState || !acDef || !acState.unlocked) return false;
  const currentTier = acState.upgrades[slotIndex];
  if (currentTier >= 5) return false;
  const cost = acDef.upgradeCosts[slotIndex][currentTier];
  if (!spendCredits(cost)) return false;
  acState.upgrades[slotIndex]++;
  return true;
}

function unlockAircraft(aircraftId) {
  const acDef = AIRCRAFT.find(a => a.id === aircraftId);
  const acState = state.aircraft[aircraftId];
  if (!acDef || !acState || acState.unlocked) return false;
  if (!spendCredits(acDef.unlockCost)) return false;
  acState.unlocked = true;
  return true;
}

function buyBaseUpgrade(sectionKey) {
  const currentLevel = state.baseUpgrades[sectionKey] || 0;
  const section = BASE_SECTIONS.find(s => s.key === sectionKey);
  if (!section || currentLevel >= section.upgrades.length) return false;
  const cost = section.upgrades[currentLevel].cost;
  if (!spendCredits(cost)) return false;
  state.baseUpgrades[sectionKey]++;
  return true;
}

function prestige() {
  if (state.totalCreditsEarned < prestigeThreshold()) return false;
  state.prestigeStars++;
  // Reset credits and missions but keep aircraft unlocks, upgrades, base upgrades
  state.credits = 0;
  state.totalCreditsEarned = 0;
  state.totalMissionsCompleted = 0;
  state.activeBoosts = [];
  state.crateQueue = [];
  for (const ac of AIRCRAFT) {
    state.aircraft[ac.id].currentMission = null;
    state.aircraft[ac.id].cooldownUntil = 0;
    state.aircraft[ac.id].totalMissionsFlown = 0;
  }
  return true;
}

function prestigeThreshold() {
  return 500000 * Math.pow(3, state.prestigeStars);
}

function openNextCrate() {
  if (!state.crateQueue.length) return null;
  const tier = state.crateQueue.shift();
  state.totalCratesOpened++;
  const reward = rollCrate(tier);
  applyReward(reward, state);
  return { tier, reward };
}

function buyCrate(tier) {
  const cost = CRATE_COSTS[tier];
  if (!spendCredits(cost)) return false;
  state.crateQueue.push(tier);
  return true;
}

function pruneExpiredBoosts() {
  const now = Date.now();
  state.activeBoosts = state.activeBoosts.filter(b => b.expiresAt > now);
}

let canvas, ctx, dpr, W, H;
let bgCache = null;

// Pad layout: 5 columns × 2 rows (indices match AIRCRAFT array order)
const PAD_COLS = 5;
const PAD_ROWS = 2;
let pads = []; // computed on init

const completionFlashes = {}; // aircraftId → { t: 0-1, color }
const missionPulses = {};     // aircraftId → pulse alpha

function initRenderer(canvasEl) {
  canvas = canvasEl;
  resizeCanvas();
  window.addEventListener('resize', () => { resizeCanvas(); bgCache = null; });
}

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  computePads();
  bgCache = null;
}

function computePads() {
  pads = [];
  const padW = W / PAD_COLS;
  const padH = H / PAD_ROWS;
  for (let r = 0; r < PAD_ROWS; r++) {
    for (let c = 0; c < PAD_COLS; c++) {
      pads.push({ x: padW * c + padW / 2, y: padH * r + padH / 2 });
    }
  }
}

function buildBackground() {
  const oc = document.createElement('canvas');
  oc.width  = W * dpr;
  oc.height = H * dpr;
  const oc2 = oc.getContext('2d');
  oc2.scale(dpr, dpr);

  // Base gradient
  const grad = oc2.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a180a');
  grad.addColorStop(1, '#0d200d');
  oc2.fillStyle = grad;
  oc2.fillRect(0, 0, W, H);

  // Hex-ish grid lines
  oc2.strokeStyle = 'rgba(74,222,128,0.06)';
  oc2.lineWidth = 0.5;
  const spacing = 30;
  for (let x = 0; x < W; x += spacing) {
    oc2.beginPath(); oc2.moveTo(x, 0); oc2.lineTo(x, H); oc2.stroke();
  }
  for (let y = 0; y < H; y += spacing) {
    oc2.beginPath(); oc2.moveTo(0, y); oc2.lineTo(W, y); oc2.stroke();
  }

  // Pad circles
  for (const pad of pads) {
    oc2.beginPath();
    oc2.arc(pad.x, pad.y, 28, 0, Math.PI * 2);
    oc2.strokeStyle = 'rgba(74,222,128,0.18)';
    oc2.lineWidth = 1;
    oc2.stroke();
    oc2.fillStyle = 'rgba(74,222,128,0.04)';
    oc2.fill();
  }

  bgCache = oc;
}

function drawPolygonPart(part, cx, cy, scale, globalAlpha) {
  if (!part.points || part.points.length < 3) return;
  ctx.save();
  ctx.globalAlpha = (part.alpha !== undefined ? part.alpha : 1) * globalAlpha;
  ctx.beginPath();
  ctx.moveTo(cx + part.points[0][0] * scale, cy + part.points[0][1] * scale);
  for (let i = 1; i < part.points.length; i++) {
    ctx.lineTo(cx + part.points[i][0] * scale, cy + part.points[i][1] * scale);
  }
  ctx.closePath();
  ctx.fillStyle = part.color;
  ctx.fill();
  ctx.restore();
}

function drawAircraft(acDef, cx, cy, scale, alpha, glowing) {
  if (glowing) {
    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = acDef.color;
  }
  for (const part of acDef.parts) {
    drawPolygonPart(part, cx, cy, scale, alpha);
  }
  if (glowing) ctx.restore();
}

function drawLockOverlay(cx, cy) {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.arc(cx, cy, 28, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(200,200,200,0.5)';
  ctx.font = '18px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔒', cx, cy);
  ctx.restore();
}

function drawMissionArc(acDef, pad, endX, endY, progress, timestamp) {
  ctx.save();
  // Dashed arc
  ctx.setLineDash([6, 5]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = acDef.color + '88';
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const pt = getArcPoint(pad.x, pad.y, endX, endY, i / 40);
    if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Traveling dot
  const dotPt = getArcPoint(pad.x, pad.y, endX, endY, easeInOut(progress));
  const pulse = Math.sin(timestamp * 0.005) * 0.4 + 0.6;
  ctx.beginPath();
  ctx.arc(dotPt.x, dotPt.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = acDef.color;
  ctx.shadowBlur = 10;
  ctx.shadowColor = acDef.color;
  ctx.globalAlpha = pulse;
  ctx.fill();
  ctx.restore();
}

function drawZoneTarget(x, y, color, timestamp) {
  const r = 8 + Math.sin(timestamp * 0.004) * 3;
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.7;
  ctx.fill();
  ctx.restore();
}

function drawCompletionFlash(flash, cx, cy) {
  ctx.save();
  const r = flash.t * 45;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(74,222,128,${(1 - flash.t) * 0.7})`;
  ctx.fill();
  ctx.restore();
}

// Zone positions (normalized to canvas, avoid edges)
function getZonePos(index) {
  const zones = [
    [0.1, 0.5], [0.9, 0.5], [0.5, 0.08], [0.15, 0.15],
    [0.85, 0.85], [0.5, 0.92],
  ];
  const z = zones[index % zones.length];
  return { x: z[0] * W, y: z[1] * H };
}

function triggerCompletionFlash(aircraftId) {
  completionFlashes[aircraftId] = { t: 0 };
}

function renderFrame(st, timestamp) {
  if (W === 0) return;
  if (!bgCache) buildBackground();

  ctx.clearRect(0, 0, W, H);
  ctx.drawImage(bgCache, 0, 0, W, H);

  const now = Date.now();
  const scale = Math.min(W / PAD_COLS, H / PAD_ROWS) * 0.38;

  // Draw mission arcs and zone targets
  AIRCRAFT.forEach((acDef, i) => {
    const acState = st.aircraft[acDef.id];
    if (!acState || !acState.unlocked || !acState.currentMission) return;
    const m = acState.currentMission;
    if (m.endTime <= now) return;
    const pad = pads[i];
    if (!pad) return;
    const progress = clamp((now - m.startTime) / (m.endTime - m.startTime), 0, 1);
    const zonePos = getZonePos(i);
    drawZoneTarget(zonePos.x, zonePos.y, acDef.color, timestamp);
    drawMissionArc(acDef, pad, zonePos.x, zonePos.y, progress, timestamp);
  });

  // E-3 radar sweep when deployed
  const e3State = st.aircraft.e3;
  if (e3State && e3State.currentMission && e3State.currentMission.endTime > now) {
    const angle = (timestamp * 0.001) % (Math.PI * 2);
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, Math.max(W, H) * 0.7, -0.3, 0.3);
    ctx.closePath();
    ctx.fillStyle = 'rgba(139,233,253,0.06)';
    ctx.fill();
    ctx.restore();
  }

  // Draw aircraft on pads
  AIRCRAFT.forEach((acDef, i) => {
    const acState = st.aircraft[acDef.id];
    const pad = pads[i];
    if (!pad) return;

    const onMission = acState && acState.currentMission && acState.currentMission.endTime > now;

    if (!acState || !acState.unlocked) {
      drawAircraft(acDef, pad.x, pad.y, scale, 0.2, false);
      drawLockOverlay(pad.x, pad.y);
    } else if (onMission) {
      drawAircraft(acDef, pad.x, pad.y, scale, 0.3, false);
    } else {
      drawAircraft(acDef, pad.x, pad.y, scale, 1.0, true);
    }

    // Completion flash animation
    const flash = completionFlashes[acDef.id];
    if (flash) {
      drawCompletionFlash(flash, pad.x, pad.y);
      flash.t += 0.04;
      if (flash.t >= 1) delete completionFlashes[acDef.id];
    }
  });

  // HUD credits overlay (top-right corner)
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(W - 95, 4, 91, 18);
  ctx.fillStyle = '#4ade80';
  ctx.font = `bold ${Math.max(10, Math.min(13, W * 0.032))}px monospace`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.fillText(formatCredits(st.credits), W - 6, 7);
  ctx.restore();
}


// ── src/ui.js ──






let callbacks = {};
let activeTab = 'base';
let selectedAircraftId = 'ac130';
let crateAnimating = false;
let crateResult = null;

// DOM refs
let tabBar, statsBar, boostBar, scrollPanel;
let panelBase, panelPlanes, panelOps, panelPrestige;
let crateModal, crateBox, crateLabel, crateReward, crateTier;

function initUI() {
  tabBar     = document.getElementById('tab-bar');
  statsBar   = document.getElementById('stats-bar');
  boostBar   = document.getElementById('boost-bar');
  scrollPanel= document.getElementById('scroll-panel');
  panelBase  = document.getElementById('panel-base');
  panelPlanes= document.getElementById('panel-planes');
  panelOps   = document.getElementById('panel-ops');
  panelPrestige=document.getElementById('panel-prestige');
  crateModal = document.getElementById('crate-modal');
  crateBox   = document.getElementById('crate-box');
  crateLabel = document.getElementById('crate-label');
  crateReward= document.getElementById('crate-reward');
  crateTier  = null;
}

function bindEvents(cbs) {
  callbacks = cbs;

  // Tab switching
  tabBar.addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });

  // Crate badge in stats bar
  document.getElementById('crate-badge').addEventListener('click', () => {
    openCrateModal(callbacks.getState());
  });

  // Crate modal open box
  crateModal.addEventListener('click', e => {
    if (e.target.id === 'crate-open-btn') {
      performCrateOpen();
    } else if (e.target.id === 'crate-open-all-btn') {
      performOpenAll();
    } else if (e.target.id === 'crate-close') {
      closeCrateModal();
    } else if (e.target.classList.contains('crate-buy-btn')) {
      const tier = e.target.dataset.tier;
      callbacks.onBuyCrate(tier);
      renderCrateModal(callbacks.getState());
    }
  });

  // Delegated events on scroll panel
  scrollPanel.addEventListener('click', e => {
    // Base upgrade
    const baseBtn = e.target.closest('[data-base-section]');
    if (baseBtn) { callbacks.onBuyBaseUpgrade(baseBtn.dataset.baseSection); return; }

    // Aircraft unlock
    const unlockBtn = e.target.closest('[data-unlock]');
    if (unlockBtn) { callbacks.onUnlockAircraft(unlockBtn.dataset.unlock); return; }

    // Aircraft upgrade
    const upgradeBtn = e.target.closest('[data-upgrade]');
    if (upgradeBtn) {
      const [id, slot] = upgradeBtn.dataset.upgrade.split(':');
      callbacks.onUpgradeAircraft(id, parseInt(slot));
      return;
    }

    // Select aircraft in Ops panel
    const acSelect = e.target.closest('[data-select-ac]');
    if (acSelect) { selectedAircraftId = acSelect.dataset.selectAc; renderOpsPanel(callbacks.getState()); return; }

    // Launch mission
    const launchBtn = e.target.closest('[data-launch]');
    if (launchBtn) {
      const [id, mid] = launchBtn.dataset.launch.split(':');
      callbacks.onStartMission(id, mid);
      return;
    }

    // Prestige
    if (e.target.id === 'prestige-btn') { callbacks.onPrestige(); return; }
  });
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  panelBase.style.display    = tab === 'base'    ? 'block' : 'none';
  panelPlanes.style.display  = tab === 'planes'  ? 'block' : 'none';
  panelOps.style.display     = tab === 'ops'     ? 'block' : 'none';
  panelPrestige.style.display= tab === 'prestige'? 'block' : 'none';
}

// ── Render entry point (throttled to 4fps by main.js) ─────────────────────────

function renderUI(st) {
  renderStatsBar(st);
  renderBoostBar(st);
  switch (activeTab) {
    case 'base':    renderBasePanel(st);    break;
    case 'planes':  renderPlanesPanel(st);  break;
    case 'ops':     renderOpsPanel(st);     break;
    case 'prestige':renderPrestigePanel(st);break;
  }
}

// ── Stats bar ──────────────────────────────────────────────────────────────────

function renderStatsBar(st) {
  const now = Date.now();
  let passive = 0;
  for (const a of AIRCRAFT) {
    const ac = st.aircraft[a.id];
    if (ac && ac.currentMission && ac.currentMission.endTime > now) {
      passive += ac.currentMission.passivePerSec;
    }
  }
  document.getElementById('stat-credits').textContent = formatCredits(st.credits);
  document.getElementById('stat-rate').textContent    = formatRate(passive);
  const badge = document.getElementById('crate-badge');
  const count = (st.crateQueue || []).length;
  badge.textContent = count > 0 ? `📦 ${count}` : '📦';
  badge.classList.toggle('has-crates', count > 0);
}

// ── Boost bar ─────────────────────────────────────────────────────────────────

function renderBoostBar(st) {
  const now = Date.now();
  const active = (st.activeBoosts || []).filter(b => b.expiresAt > now);
  if (!active.length) { boostBar.innerHTML = ''; return; }
  boostBar.innerHTML = active.map(b => {
    const remaining = Math.ceil((b.expiresAt - now) / 1000);
    const label = b.type === 'income' ? '⚡Income' : b.type === 'payout' ? '💰Payout' : '🚀Speed';
    return `<span class="boost-pill">${label} ×${b.multiplier} ${formatTime(remaining)}</span>`;
  }).join('');
}

// ── BASE panel (Idle Miner style strips) ───────────────────────────────────────

function renderBasePanel(st) {
  const slots = getMaxMissionSlots(st);
  panelBase.innerHTML = `
    <div class="section-header">Base Command <span class="slots-badge">${slots} Mission Slots</span></div>
    ${BASE_SECTIONS.map(section => renderBaseSection(section, st)).join('')}
  `;
}

function renderBaseSection(section, st) {
  const bought = st.baseUpgrades[section.key] || 0;
  const upgrades = section.upgrades;
  return `
    <div class="base-section">
      <div class="base-section-title">${section.icon} ${section.name}</div>
      <div class="base-section-desc">${section.effectDesc}</div>
      <div class="base-upgrades-strip">
        ${upgrades.map((upg, i) => {
          const done = i < bought;
          const next = i === bought;
          const locked = i > bought;
          const canAfford = next && st.credits >= upg.cost;
          let cls = 'upg-box';
          if (done) cls += ' done';
          else if (next && canAfford) cls += ' affordable';
          else if (next) cls += ' next';
          else cls += ' locked';
          return `<div class="${cls}" ${next ? `data-base-section="${section.key}"` : ''} title="${upg.name}\n${upg.desc}">
            ${done ? `<span class="upg-check">✓</span>` : `<span class="upg-num">${i+1}</span>`}
            ${next ? `<span class="upg-cost">${formatCredits(upg.cost)}</span>` : ''}
          </div>`;
        }).join('')}
      </div>
      <div class="base-section-progress">${bought}/${upgrades.length} purchased</div>
    </div>
  `;
}

// ── PLANES panel ───────────────────────────────────────────────────────────────

function renderPlanesPanel(st) {
  const now = Date.now();
  panelPlanes.innerHTML = AIRCRAFT.map(ac => renderAircraftCard(ac, st, now)).join('');
}

function renderAircraftCard(acDef, st, now) {
  const acState = st.aircraft[acDef.id];
  const unlocked = acState && acState.unlocked;
  const onMission = unlocked && acState.currentMission && acState.currentMission.endTime > now;
  const upgrades = acState ? acState.upgrades : [0,0,0,0,0];

  const statusText = !unlocked
    ? `Locked — ${formatCredits(acDef.unlockCost)} Credits`
    : onMission
      ? `On mission — ${formatTime((acState.currentMission.endTime - now) / 1000)} remaining`
      : 'Ready';

  const upgradesHtml = acDef.upgradeNames.map((name, i) => {
    const tier = upgrades[i];
    const maxed = tier >= 5;
    const cost = !maxed ? acDef.upgradeCosts[i][tier] : 0;
    const canAfford = !maxed && st.credits >= cost;
    return `<div class="upgrade-row">
      <span class="upg-name">${name}</span>
      <div class="upg-pips">${[0,1,2,3,4].map(p => `<span class="pip ${p < tier ? 'filled' : ''}"></span>`).join('')}</div>
      ${maxed ? '<span class="upg-maxed">MAX</span>' :
        `<button class="btn-upg ${canAfford ? '' : 'cant-afford'}" data-upgrade="${acDef.id}:${i}" ${!unlocked || !canAfford ? 'disabled' : ''}>${formatCredits(cost)}</button>`}
    </div>`;
  }).join('');

  return `<div class="ac-card ${!unlocked ? 'locked' : ''}">
    <div class="ac-card-header">
      <canvas class="ac-minicanvas" data-acid="${acDef.id}" width="56" height="56"></canvas>
      <div class="ac-info">
        <div class="ac-name">${acDef.name}</div>
        <div class="ac-role">${acDef.role}</div>
        <div class="ac-status ${onMission ? 'on-mission' : unlocked ? 'ready' : 'locked-status'}">${statusText}</div>
      </div>
      ${!unlocked ? `<button class="btn-unlock ${st.credits >= acDef.unlockCost ? '' : 'cant-afford'}" data-unlock="${acDef.id}" ${st.credits < acDef.unlockCost ? 'disabled' : ''}>Unlock<br>${formatCredits(acDef.unlockCost)}</button>` : ''}
    </div>
    ${unlocked ? `<div class="ac-special">⭐ ${acDef.specialDesc}</div>` : ''}
    ${unlocked ? `<div class="ac-upgrades">${upgradesHtml}</div>` : ''}
  </div>`;
}

// ── OPS panel ─────────────────────────────────────────────────────────────────

function renderOpsPanel(st) {
  const now = Date.now();
  const slots = getMaxMissionSlots(st);
  const used  = AIRCRAFT.filter(a => {
    const ac = st.aircraft[a.id];
    return ac && ac.currentMission && ac.currentMission.endTime > now;
  }).length;

  const acSelector = `<div class="ac-selector">
    ${AIRCRAFT.filter(a => st.aircraft[a.id] && st.aircraft[a.id].unlocked).map(a =>
      `<button class="ac-sel-btn ${selectedAircraftId === a.id ? 'selected' : ''}" data-select-ac="${a.id}">${a.name.split(' ')[0]}</button>`
    ).join('')}
  </div>`;

  const acDef   = getAircraftById(selectedAircraftId);
  const acState = st.aircraft[selectedAircraftId];
  if (!acDef || !acState || !acState.unlocked) {
    panelOps.innerHTML = `<div class="ops-header">Operations — ${used}/${slots} slots active</div>${acSelector}<p class="empty-msg">Select an unlocked aircraft above.</p>`;
    return;
  }

  const missions = getMissionsByAircraft(selectedAircraftId);
  const weaponsTier = acState.upgrades[3] || 0;
  const onMission = acState.currentMission && acState.currentMission.endTime > now;

  const missionCards = missions.map(m => {
    const available = m.tier === 1 || weaponsTier >= 1;
    const dur  = getMissionDuration(selectedAircraftId, m.id, st);
    const pay  = getMissionPayout(selectedAircraftId, m.id, st);
    const pass = getMissionPassive(selectedAircraftId, m.id, st);
    const canLaunch = available && !onMission && used < slots;
    return `<div class="mission-card ${!available ? 'locked-mission' : ''}">
      <div class="mission-name">${m.name}</div>
      <div class="mission-desc">${m.desc}</div>
      <div class="mission-stats">
        <span>⏱ ${formatTime(dur)}</span>
        <span>💰 ${formatCredits(pay)}</span>
        <span>📈 ${formatRate(pass)}</span>
      </div>
      ${!available ? '<div class="mission-locked">Requires Weapons Loadout upgrade</div>' :
        `<button class="btn-launch ${canLaunch ? '' : 'cant-afford'}" data-launch="${selectedAircraftId}:${m.id}" ${!canLaunch ? 'disabled' : ''}>Launch</button>`}
    </div>`;
  }).join('');

  let activeInfo = '';
  if (onMission) {
    const m = acState.currentMission;
    const timeLeft = Math.max(0, (m.endTime - now) / 1000);
    activeInfo = `<div class="active-mission-banner">
      ✈ Active Mission — ${formatTime(timeLeft)} remaining — ${formatRate(m.passivePerSec)}
    </div>`;
  }

  panelOps.innerHTML = `
    <div class="ops-header">Operations — ${used}/${slots} slots active</div>
    ${acSelector}
    ${activeInfo}
    <div class="mission-grid">${missionCards}</div>
  `;
}

// ── PRESTIGE panel ────────────────────────────────────────────────────────────

function renderPrestigePanel(st) {
  const { prestigeThreshold } = callbacks;
  const threshold = prestigeThreshold();
  const progress  = Math.min(1, st.totalCreditsEarned / threshold);
  const pct = Math.round(progress * 100);
  const stars = st.prestigeStars;
  const multiplier = 1 + stars * 0.25;
  const canPrestige = st.totalCreditsEarned >= threshold;

  panelPrestige.innerHTML = `
    <div class="prestige-section">
      <div class="prestige-stars">${'⭐'.repeat(Math.min(stars, 20))} ${stars > 0 ? `×${stars}` : ''}</div>
      <div class="prestige-multi">Income Multiplier: <strong>×${multiplier.toFixed(2)}</strong></div>
      <div class="prestige-label">Total Credits Earned</div>
      <div class="prestige-bar-wrap">
        <div class="prestige-bar" style="width:${pct}%"></div>
      </div>
      <div class="prestige-numbers">${formatCredits(st.totalCreditsEarned)} / ${formatCredits(threshold)}</div>
      <button id="prestige-btn" class="btn-prestige ${canPrestige ? '' : 'cant-afford'}" ${canPrestige ? '' : 'disabled'}>
        ${canPrestige ? '🌟 Prestige Now' : `Prestige (${pct}%)`}
      </button>
      ${stars > 0 ? `<div class="prestige-info">Each prestige resets credits but keeps all upgrades.<br>Income ×${(1 + (stars+1) * 0.25).toFixed(2)} after next prestige.</div>` : `<div class="prestige-info">Prestige resets credits but keeps all aircraft and base upgrades. Earn a permanent income multiplier.</div>`}
    </div>
    <div class="prestige-section">
      <div class="base-section-title">Buy Crates</div>
      ${['common','rare','epic'].map(tier => {
        const info = CRATE_COLORS[tier];
        const cost = CRATE_COSTS[tier];
        return `<button class="crate-buy-btn tier-${tier} ${st.credits >= cost ? '' : 'cant-afford'}" data-tier="${tier}" ${st.credits < cost ? 'disabled' : ''}>
          ${info.label} — ${formatCredits(cost)}
        </button>`;
      }).join('')}
    </div>
  `;
}

// ── Crate modal ───────────────────────────────────────────────────────────────

function openCrateModal(st) {
  if (!st.crateQueue || !st.crateQueue.length) return;
  crateModal.style.display = 'flex';
  crateResult = null;
  renderCrateModal(st);
}

function renderCrateModal(st) {
  const count = (st.crateQueue || []).length;
  if (!count && !crateResult) { closeCrateModal(); return; }
  const tier = crateResult ? crateResult.tier : (st.crateQueue[0] || 'common');
  const info = CRATE_COLORS[tier];

  crateModal.querySelector('.crate-modal-inner').innerHTML = `
    <button id="crate-close" class="crate-close">✕</button>
    <div class="crate-title" style="color:${info.border}">${info.label}</div>
    <div class="crate-box-wrap">
      <div id="crate-box" class="crate-box ${crateAnimating ? 'shaking' : ''}" style="border-color:${info.border};box-shadow:0 0 24px ${info.glow}">
        ${crateResult
          ? `<div class="crate-reward-text" style="color:${info.border}">${crateResult.reward.label}</div>`
          : `<div class="crate-icon">📦</div>`}
      </div>
    </div>
    ${crateResult
      ? `<button id="crate-open-btn" class="btn-crate-open" style="border-color:${info.border}">
           ${count > 0 ? 'Open Next' : 'Done'}
         </button>`
      : `<button id="crate-open-btn" class="btn-crate-open" style="border-color:${info.border}">Tap to Open</button>`}
    ${count > 1 ? `<button id="crate-open-all-btn" class="btn-crate-all">Open All (${count})</button>` : ''}
  `;
}

function performCrateOpen() {
  crateResult = callbacks.onOpenCrate();
  if (!crateResult) { closeCrateModal(); return; }
  crateAnimating = true;
  renderCrateModal(callbacks.getState());
  setTimeout(() => { crateAnimating = false; }, 400);
}

function performOpenAll() {
  let last = null;
  const st = callbacks.getState();
  const count = st.crateQueue.length;
  for (let i = 0; i < count; i++) {
    last = callbacks.onOpenCrate();
  }
  crateResult = last;
  renderCrateModal(callbacks.getState());
}

function closeCrateModal() {
  crateModal.style.display = 'none';
  crateResult = null;
  crateAnimating = false;
}

// Draw aircraft silhouettes into mini canvases in the Planes panel
function drawMiniCanvases() {
  document.querySelectorAll('.ac-minicanvas').forEach(mc => {
    const id = mc.dataset.acid;
    const acDef = getAircraftById(id);
    if (!acDef) return;
    const dpr = window.devicePixelRatio || 1;
    const size = mc.getBoundingClientRect().width || 56;
    mc.width  = size * dpr;
    mc.height = size * dpr;
    const c = mc.getContext('2d');
    c.scale(dpr, dpr);
    c.clearRect(0, 0, size, size);
    const scale = size * 0.44;
    const cx = size / 2;
    const cy = size / 2;
    for (const part of acDef.parts) {
      c.save();
      c.globalAlpha = part.alpha !== undefined ? part.alpha : 1;
      c.beginPath();
      c.moveTo(cx + part.points[0][0] * scale, cy + part.points[0][1] * scale);
      for (let i = 1; i < part.points.length; i++) {
        c.lineTo(cx + part.points[i][0] * scale, cy + part.points[i][1] * scale);
      }
      c.closePath();
      c.fillStyle = part.color;
      c.shadowBlur = 8;
      c.shadowColor = part.color;
      c.fill();
      c.restore();
    }
  });
}


// ── src/main.js ──





let lastTs = 0;
let lastUIUpdate = 0;
let lastSave = 0;

async function init() {
  loadState();
  applyOfflineEarnings();

  const canvas = document.getElementById('game-canvas');
  initRenderer(canvas);
  initUI();

  bindEvents({
    getState: () => state,
    prestigeThreshold,
    onStartMission: (aircraftId, missionId) => {
      if (startMission(aircraftId, missionId)) renderUI(state);
    },
    onUpgradeAircraft: (aircraftId, slotIndex) => {
      if (upgradeAircraft(aircraftId, slotIndex)) renderUI(state);
    },
    onUnlockAircraft: (aircraftId) => {
      if (unlockAircraft(aircraftId)) renderUI(state);
    },
    onBuyBaseUpgrade: (sectionKey) => {
      if (buyBaseUpgrade(sectionKey)) renderUI(state);
    },
    onPrestige: () => {
      if (prestige()) renderUI(state);
    },
    onOpenCrate: () => {
      const result = openNextCrate();
      if (result) {
        handlePendingActions();
        renderUI(state);
      }
      return result;
    },
    onBuyCrate: (tier) => {
      if (buyCrate(tier)) renderUI(state);
    },
  });

  renderUI(state);
  requestAnimationFrame(gameLoop);

  setInterval(() => saveState(), 15000);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      saveState();
    } else {
      applyOfflineEarnings();
      renderUI(state);
    }
  });

  registerSW();
}

function gameLoop(ts) {
  const dt = Math.min((ts - (lastTs || ts)) / 1000, 0.1);
  lastTs = ts;

  tick(dt, ts);

  renderFrame(state, ts);

  if (ts - lastUIUpdate > 250) {
    renderUI(state);
    drawMiniCanvases();
    lastUIUpdate = ts;
  }

  requestAnimationFrame(gameLoop);
}

function tick(dt, ts) {
  pruneExpiredBoosts();

  const now = Date.now();

  for (const ac of AIRCRAFT) {
    const acState = state.aircraft[ac.id];
    if (!acState || !acState.currentMission) continue;
    const m = acState.currentMission;

    if (m.endTime <= now) {
      completeMission(ac.id);
      triggerCompletionFlash(ac.id);
      handlePendingActions();
    } else {
      // Drip passive income
      addCredits(m.passivePerSec * dt);
    }
  }

  state.lastTick = now;
}

function handlePendingActions() {
  if (state._pendingInstantComplete) {
    const target = state._pendingInstantComplete;
    state._pendingInstantComplete = null;
    const now = Date.now();
    for (const ac of AIRCRAFT) {
      const acState = state.aircraft[ac.id];
      if (!acState || !acState.currentMission) continue;
      if (target === 'all' || target > 0) {
        acState.currentMission.endTime = now - 1;
      }
      if (typeof target === 'number' && target > 0) break;
    }
  }

  if (state._pendingUnlockNext) {
    state._pendingUnlockNext = false;
    for (const ac of AIRCRAFT) {
      const acState = state.aircraft[ac.id];
      if (acState && !acState.unlocked) {
        acState.unlocked = true;
        break;
      }
    }
  }
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  try {
    await navigator.serviceWorker.register('./service-worker.js', { scope: './' });
  } catch {}
}

init();

})();
