<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IRONSKY — INFINITE COMMAND</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IRONSKY">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--g:#00e87a;--g2:#009e52;--a:#f5a623;--r:#ff4757;--b:#1e90ff;--p:#a855f7;--c:#00d2ff;--bg:#090c10;--bg2:#0f1318;--bg3:#141921;--card:#161d28;--card2:#1c2535;--border:#ffffff12;--border2:#ffffff1e;--text:#dde3ee;--muted:#5a6478;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;font-weight:500;overflow:hidden;height:100dvh;width:100vw;display:flex;flex-direction:column}
#topbar{height:52px;min-height:52px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:7px;z-index:20;flex-shrink:0;overflow-x:auto}
#logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:14px;color:var(--g);letter-spacing:3px;text-shadow:0 0 12px #00e87a55;white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--border2);border-radius:7px;padding:4px 8px;white-space:nowrap;flex-shrink:0}
.pill .l{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.pill .v{font-family:'Orbitron',sans-serif;font-size:11px;font-weight:700;color:var(--a)}
.pill .v.g{color:var(--g)}.pill .v.b{color:var(--b)}.pill .v.p{color:var(--p)}.pill .v.c{color:#00d2ff}
#prestige-pill{background:linear-gradient(135deg,#1a0a2e,#0d1a2e);border-color:#a855f755;cursor:pointer}
#save-dot{width:6px;height:6px;border-radius:50%;background:var(--muted);margin-left:auto;flex-shrink:0;transition:all 0.3s}
#save-dot.on{background:var(--g);box-shadow:0 0 6px var(--g)}
#main{flex:1;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;display:none;padding:12px;padding-bottom:72px}
.view.active{display:block}
#view-scene{padding:0;overflow:hidden}
#view-scene.active{display:flex;flex-direction:column}
#bottomnav{height:56px;min-height:56px;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:20;flex-shrink:0}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;border:none;background:none;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:8.5px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;transition:color 0.15s;padding:4px 0;position:relative;min-width:0}
.nb svg{width:15px;height:15px;stroke-width:1.8;stroke:currentColor;fill:none;transition:all 0.15s}
.nb.active{color:var(--g)}.nb.active svg{filter:drop-shadow(0 0 3px var(--g))}
.nb::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--g);border-radius:0 0 2px 2px;opacity:0;transition:opacity 0.15s}
.nb.active::after{opacity:1}
.nb .bdot{position:absolute;top:5px;right:calc(50% - 11px);width:6px;height:6px;border-radius:50%;background:var(--r);display:none}
.nb .bdot.show{display:block}
#scene-canvas{flex:1;display:block;width:100%}
#scene-hud{position:absolute;top:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 8px;pointer-events:none}
.s-chip{background:rgba(9,12,16,0.85);border:1px solid var(--border2);border-radius:6px;padding:3px 8px;font-size:10px;color:var(--text);backdrop-filter:blur(6px)}
.s-chip b{color:var(--g);font-family:'Orbitron',sans-serif;font-size:9px}
.sh{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--muted);letter-spacing:3px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sh span{font-size:10px;color:var(--a)}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px}
.card.hi{border-color:var(--border2)}
.acg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px}
.acc.locked{opacity:0.38}
.acc .cnt{position:absolute;top:7px;right:7px;font-family:'Orbitron',sans-serif;font-size:8px;background:#00e87a18;border:1px solid #00e87a33;border-radius:3px;padding:1px 4px;color:var(--g)}
.aname{font-family:'Orbitron',sans-serif;font-size:8.5px;font-weight:700;color:var(--text);line-height:1.3}
.arole{font-size:9.5px;color:var(--muted)}
.astat{display:flex;justify-content:space-between;font-size:10px}.astat .k{color:var(--muted)}.astat .v{color:var(--g);font-weight:700}
.aspec{font-size:9.5px;color:var(--muted);font-style:italic;line-height:1.4}
.btn{border:none;border-radius:7px;padding:7px 12px;font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.5px;cursor:pointer;transition:all 0.12s;width:100%;margin-top:7px}
.bg{background:var(--g2);color:#000}.bg:hover:not(:disabled){background:var(--g);box-shadow:0 0 10px #00e87a44}
.ba{background:#b07018;color:#000}.ba:hover:not(:disabled){background:var(--a);box-shadow:0 0 10px #f5a62344}
.br{background:#cc2233;color:#fff}.br:hover:not(:disabled){background:var(--r);box-shadow:0 0 10px #ff475744}
.bb{background:#1255a0;color:#fff}.bb:hover:not(:disabled){background:var(--b);box-shadow:0 0 10px #1e90ff44}
.bp{background:#6b21a8;color:#fff}.bp:hover:not(:disabled){background:var(--p);box-shadow:0 0 10px #a855f744}
.bc2{background:linear-gradient(135deg,#001a22,#001022);color:#00d2ff;border:1px solid #00d2ff33}.bc2:hover:not(:disabled){background:linear-gradient(135deg,#002a35,#001832);box-shadow:0 0 10px #00d2ff44}
.bm{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.btn:disabled{opacity:0.3;cursor:not-allowed}
.bdg{font-family:'Orbitron',sans-serif;font-size:9px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.bdg-g{background:#00e87a15;color:var(--g);border:1px solid #00e87a30}
.bdg-a{background:#f5a62315;color:var(--a);border:1px solid #f5a62330}
.bdg-b{background:#1e90ff15;color:var(--b);border:1px solid #1e90ff30}
.bdg-r{background:#ff475715;color:var(--r);border:1px solid #ff475730}
.bdg-p{background:#a855f715;color:var(--p);border:1px solid #a855f730}
.bdg-m{background:#ffffff08;color:var(--muted);border:1px solid var(--border)}
.bdg-c{background:#00d2ff15;color:#00d2ff;border:1px solid #00d2ff30}
.pw{height:4px;background:#ffffff0a;border-radius:2px;margin-top:5px;overflow:hidden}
.pf{height:100%;border-radius:2px;transition:width 0.2s}
.pf.g{background:var(--g)}.pf.b{background:var(--b)}.pf.a{background:var(--a)}.pf.p{background:var(--p)}.pf.r{background:var(--r)}
.mc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px}
.mc.run{border-color:#1e90ff33}.mc.auto{border-color:#00e87a22}
.mh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:3px}
.mt{font-size:14px;font-weight:700;color:var(--text)}.ms{font-size:10px;color:var(--muted);margin-bottom:5px}
.mf{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.uc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px}
.uh{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.ui{font-size:20px;flex-shrink:0}.un{font-size:14px;font-weight:700;color:var(--text)}.ud{font-size:10px;color:var(--muted);margin-top:2px}
.ul{font-family:'Orbitron',sans-serif;font-size:9px;color:var(--b);margin-top:2px}
.dots{display:flex;gap:3px;margin-bottom:7px}
.dot{height:3px;flex:1;border-radius:2px;background:var(--border)}.dot.on{background:var(--b)}
.bc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px}
.bc.built{border-color:#00e87a22}
.bh{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.bi{font-size:24px}.bn{font-size:14px;font-weight:700;color:var(--text)}.bd{font-size:10px;color:var(--muted)}.be{font-size:11px;color:var(--g);margin-top:2px}
.wcard{background:var(--card);border:1px solid #ff475722;border-radius:10px;padding:13px;margin-bottom:7px}
.wname{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--r);margin-bottom:7px}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.wstat{font-size:11px;color:var(--muted)}.wstat span{color:var(--text);font-weight:600}
.wres{background:var(--card2);border-radius:10px;padding:16px;text-align:center;margin-bottom:9px}
.wrt{font-family:'Orbitron',sans-serif;font-size:17px;font-weight:900;margin-bottom:5px}
.wlog{background:#090c10;border-radius:8px;padding:9px;text-align:left;max-height:130px;overflow-y:auto;font-size:10px;color:var(--muted);line-height:1.9}
.wl-w{color:var(--g)}.wl-l{color:var(--r)}
/* theatre */
.thcard{background:var(--card);border:1px solid #1e90ff22;border-radius:10px;padding:11px;margin-bottom:9px}
.thcard.conquered{border-color:#00e87a44;background:linear-gradient(135deg,#0a1810,#0c1525)}
.thname{font-family:'Orbitron',sans-serif;font-size:10px;color:var(--b);letter-spacing:2px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.bgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px}
.bbtn{border-radius:5px;padding:5px 2px;font-size:8px;font-family:'Orbitron',sans-serif;cursor:pointer;text-align:center;transition:all 0.15s;border:1px solid var(--border)}
.bbtn.won{background:#00e87a18;border-color:#00e87a44;color:var(--g)}
.bbtn.avail{background:#1e90ff18;border-color:#1e90ff44;color:var(--b);cursor:pointer}
.bbtn.locked{background:var(--card2);color:var(--muted);cursor:not-allowed;opacity:0.4}
/* action */
.actcard{background:var(--card);border:1px solid var(--border2);border-radius:10px;padding:13px;margin-bottom:9px}
.actcard.cooling{border-color:#1e90ff33}
.actitle{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--c);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.acdesc{font-size:10px;color:var(--muted);margin-bottom:7px;line-height:1.5}
.acinfo{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:8px;font-size:10px}
.acinfo span{color:var(--muted)}.acinfo b{color:var(--text)}
/* mini-game modal */
.mgmodal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.94);display:flex;align-items:center;justify-content:center;padding:12px}
.mgbox{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:14px;max-width:350px;width:100%;display:flex;flex-direction:column;align-items:center;gap:8px;max-height:90vh;overflow-y:auto}
.mgtitle{font-family:'Orbitron',sans-serif;font-size:12px;color:var(--c);letter-spacing:2px}
.mgsub{font-size:10px;color:var(--muted);text-align:center}
.mghud{display:flex;gap:14px;font-size:11px;font-weight:600}
.mghud span{color:var(--muted)}.mghud b{color:var(--a)}
#mg-canvas{border:1px solid var(--border2);border-radius:8px;display:block;touch-action:none;cursor:crosshair;max-width:100%}
/* commander */
.cmdcard{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:7px}
.cmdcard.hired{border-color:#00e87a22}
.cmdhd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cmdico{font-size:26px;flex-shrink:0}.cmdnm{font-size:14px;font-weight:700;color:var(--text)}.cmddesc{font-size:10px;color:var(--muted)}.cmdbns{font-size:11px;color:var(--g);margin-top:2px}
/* prestige */
.pmodal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:12px;backdrop-filter:blur(6px);overflow-y:auto}
.pmbox{background:linear-gradient(135deg,#0d0820,#091828);border:1px solid #a855f744;border-radius:14px;padding:18px;max-width:360px;width:100%;text-align:center;margin:auto}
.ptier{background:#ffffff08;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;text-align:left}
.ptier.avail{border-color:#a855f755}
.omrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.omrow:last-of-type{border:none}.omrow .k{color:var(--muted)}.omrow .v{font-family:'Orbitron',sans-serif;font-size:11px;color:var(--a);font-weight:700}
/* offline modal */
.omodal{position:fixed;inset:0;background:rgba(0,0,0,0.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.ombox{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:22px;max-width:320px;width:100%}
/* event banner */
#evtbanner{position:fixed;top:54px;left:0;right:0;z-index:45;padding:6px 12px;display:none;pointer-events:none}
.evtcard{background:linear-gradient(135deg,#1a0f04,#0d1228);border:1px solid #f5a62355;border-radius:9px;padding:10px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:all;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
.evttext{font-size:12px;color:var(--a);font-weight:700;flex:1;line-height:1.4}
/* toast */
#toast{position:fixed;bottom:62px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none;max-width:92vw}
.tmsg{background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:6px 13px;font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;animation:ta 3s forwards}
@keyframes ta{0%{opacity:0;transform:translateY(6px)}10%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
</style>
</head>
<body>
<div id="topbar">
  <div id="logo">IRONSKY</div>
  <div class="pill"><span class="l">Credits</span><span class="v" id="hc">$500</span></div>
  <div class="pill"><span class="l">$/s</span><span class="v g" id="hi">$0</span></div>
  <div class="pill"><span class="l">Fleet</span><span class="v b" id="hf">0</span></div>
  <div class="pill" id="prestige-pill" onclick="showPrestige()"><span class="l">Stars</span><span class="v p" id="hp">★0</span></div>
  <div class="pill" id="medal-pill" style="display:none"><span class="l">Medals</span><span class="v c" id="hm">🎖0</span></div>
  <div id="save-dot" title="Autosave"></div>
</div>
<div id="main">
  <div class="view active" id="view-scene"><canvas id="scene-canvas"></canvas><div id="scene-hud"></div></div>
  <div class="view" id="view-fleet"></div>
  <div class="view" id="view-missions"></div>
  <div class="view" id="view-upgrades"></div>
  <div class="view" id="view-base"></div>
  <div class="view" id="view-war"></div>
  <div class="view" id="view-action"></div>
</div>
<nav id="bottomnav">
  <button class="nb active" data-v="scene"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Base</button>
  <button class="nb" data-v="fleet"><svg viewBox="0 0 24 24"><path d="M22 16.5L12 2 2 16.5h5l1-3h8l1 3h5z"/></svg>Fleet<div class="bdot" id="dot-fleet"></div></button>
  <button class="nb" data-v="missions"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>Ops<div class="bdot" id="dot-missions"></div></button>
  <button class="nb" data-v="upgrades"><svg viewBox="0 0 24 24"><polygon points="13,2 3,14 12,14 11,22 21,10 12,10"/></svg>Tech</button>
  <button class="nb" data-v="base"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/></svg>Build<div class="bdot" id="dot-base"></div></button>
  <button class="nb" data-v="war"><svg viewBox="0 0 24 24"><path d="M12 2l3.5 6.5L22 10l-5 5 1.2 7L12 19l-6.2 3L7 15 2 10l6.5-1.5z"/></svg>War</button>
  <button class="nb" data-v="action"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>Act</button>
</nav>
<div id="toast"></div>
<div id="evtbanner"><div class="evtcard" id="evtcard"></div></div>

    eventActive:null,savedAt:Date.now()};
}

// ═══ CALCULATIONS ═══
function calcMods(){
  let income=1,speed=1,reward=1,war=1,slots=1;
  BLDG.forEach(b=>{
    if(!S.buildings[b.id])return;
    if(b.effectKey==='income')income*=(1+b.val);
    if(b.effectKey==='speed')speed*=(1-b.val);
    if(b.effectKey==='reward')reward*=(1+b.val);
    if(b.effectKey==='war')war*=(1+b.val);
    if(b.effectKey==='slots')slots+=b.val;
    if(b.effectKey==='all'){income*=(1+b.val);speed*=(1-b.val);}
  });
  const il=S.upgLvl['income1']||0;income*=(1+il*0.20);
  const sl=S.upgLvl['speed1']||0;speed*=Math.max(0.05,1-sl*0.10);
  const rl=S.upgLvl['reward1']||0;reward*=(1+rl*0.15);
  const wl=S.upgLvl['war1']||0;war*=(1+wl*0.15);
  // commander bonuses
  COMMANDERS.forEach(c=>{
    const lvl=S.cmdLvl[c.id]||0;if(!lvl)return;
    if(c.effectKey==='income')income*=(1+c.val*lvl);
    if(c.effectKey==='speed')speed*=Math.max(0.05,1-c.val*lvl);
    if(c.effectKey==='reward')reward*=(1+c.val*lvl);
    if(c.effectKey==='war')war*=(1+c.val*lvl);
    if(c.effectKey==='wRew')war*=(1+c.val*lvl);
  });
  // theatre bonuses
  if((S.theatreWins.desert||0)>=5)income*=1.15;
  if((S.theatreWins.pacific||0)>=5){income*=1.15;war*=1.25;}
  if((S.theatreWins.arctic||0)>=5){income*=1.50;reward*=1.50;}
  // event bonus
  if(S.eventActive&&S.eventActive.endTime>Date.now()){
    if(S.eventActive.type==='fuel')income*=2;
    if(S.eventActive.type==='intel')reward*=5;
    if(S.eventActive.type==='war')war*=2;
  }
  // prestige multipliers
  income*=S.prestigeMult;reward*=S.prestigeMult;
  // medals: +2× per medal
  const mm=1+(S.medals||0)*2;income*=mm;reward*=mm;
  // ribbons: +5× per ribbon
  const rm2=1+(S.ribbons||0)*5;income*=rm2;reward*=rm2;
  return{income,speed,reward,war,slots};
}
function eliteBonus(){
  const lvl=(S.cmdLvl['eagle']||0)+(S.cmdLvl['raptor']||0);
  return 1+lvl*0.30;
}
function stealthDiscount(){
  const lvl=S.cmdLvl['phantom']||0;
  return Math.max(0.05,1-lvl*0.18);
}
function baseIPS(){
  return ACD.reduce((s,a)=>{
    const cnt=S.owned[a.id]||0;if(!cnt)return s;
    let localIPS=a.ips*cnt;
    if((a.id==='f22'||a.id==='f35')&&(S.cmdLvl['eagle']||S.cmdLvl['raptor']))localIPS*=eliteBonus();
    return s+localIPS;
  },0);
}
function ips(){return baseIPS()*calcMods().income;}

// ═══ RENDER — FLEET ═══
function renderFleet(){
  const fl=fleet();const mb=S.upgLvl['multi_buy']>0;const qty=mb?10:1;
  document.getElementById('view-fleet').innerHTML=
    `<div class="sh">Aircraft Roster <span>${fl} total · $${fmtN(ips())}/s</span></div>
    <div class="acg">`+
    ACD.map(ac=>{
      const cnt=S.owned[ac.id]||0;const locked=fl<ac.unlockF;
      let totalCost=0;for(let i=0;i<qty;i++)totalCost+=ac.cost*Math.pow(ac.cg,cnt+i);totalCost=Math.floor(totalCost);
      // stealth discount for B-2/B-21
      if((ac.id==='b2'||ac.id==='b21')&&(S.cmdLvl['phantom']||0)>0)totalCost=Math.floor(totalCost*stealthDiscount());
      const canAfford=!locked&&S.credits>=totalCost;
      const nextCost=Math.floor(ac.cost*Math.pow(ac.cg,cnt+qty));
      return`<div class="acc${locked?' locked':''}" style="border-top:2px solid ${ac.col}">
        ${cnt>0?`<div class="cnt">\xd7${cnt}</div>`:''}
        <div class="aname">${ac.name}</div>
        <div class="arole">${ac.role}</div>
        <div class="astat"><span class="k">$/sec</span><span class="v">$${fmtN(ac.ips*(cnt||1))}</span></div>
        <div class="aspec">${ac.spec}</div>
        ${locked
          ?`<button class="btn bm" disabled style="font-size:10px">Need ${ac.unlockF} fleet</button>`
          :`<button class="btn ${canAfford?'bg':'bm'}" ${!canAfford?'disabled':''} onclick="buyAC('${ac.id}')">
            ${mb?'\xd710 ':''}Buy $${fmtN(totalCost)}
           </button>
           ${cnt>0?`<div style="font-size:9px;color:var(--muted);text-align:center;margin-top:2px">Next: $${fmtN(nextCost)}</div>`:''}`}
      </div>`;
    }).join('')+`</div>`;
}

  function draw(){if(!document.getElementById('mg-canvas')){cancelAnimationFrame(window._mgRAF);return;}const now=Date.now();const dt=(now-lastTime)/1000;lastTime=now;sweepAngle+=dt*1.5;if(now-lastSpawn>1600&&blips.length<10){spawnBlip();lastSpawn=now;}for(let i=blips.length-1;i>=0;i--){blips[i].x+=blips[i].vx;blips[i].y+=blips[i].vy;blips[i].age++;if(Math.hypot(blips[i].x-150,blips[i].y-150)<28)blips.splice(i,1);}ctx.fillStyle='#060e14';ctx.fillRect(0,0,300,300);ctx.strokeStyle='#00e87a22';ctx.lineWidth=1;for(let r=35;r<=140;r+=35){ctx.beginPath();ctx.arc(150,150,r,0,Math.PI*2);ctx.stroke();}ctx.strokeStyle='#00e87a15';ctx.beginPath();ctx.moveTo(10,150);ctx.lineTo(290,150);ctx.moveTo(150,10);ctx.lineTo(150,290);ctx.stroke();ctx.save();ctx.translate(150,150);ctx.rotate(sweepAngle);const grad=ctx.createLinearGradient(0,0,140,0);grad.addColorStop(0,'rgba(0,232,122,0.55)');grad.addColorStop(1,'rgba(0,232,122,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,140,-0.45,0.45);ctx.closePath();ctx.fill();ctx.restore();blips.forEach(b=>{const pulse=Math.sin(b.age*0.25)*0.5+0.5;ctx.fillStyle=`rgba(255,71,87,${0.7+pulse*0.3})`;ctx.shadowBlur=8;ctx.shadowColor='#ff4757';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});ctx.fillStyle='#00e87a';ctx.beginPath();ctx.arc(150,150,4,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#00e87a44';ctx.lineWidth=2;ctx.beginPath();ctx.arc(150,150,28,0,Math.PI*2);ctx.stroke();if(!gameOver)window._mgRAF=requestAnimationFrame(draw);}

  if(keys['ArrowUp']||keys['KeyW']||keys['w'])pvy=-spd;else if(keys['ArrowDown']||keys['KeyS']||keys['s'])pvy=spd;else pvy*=0.8;
  px=Math.max(10,Math.min(290,px+pvx*dt));py=Math.max(10,Math.min(290,py+pvy*dt));
  // auto-fire toward nearest enemy
  if(now-lastFire>350&&enemies.length>0){let nearest=null,nd=Infinity;enemies.forEach(e=>{const d=Math.hypot(e.x-px,e.y-py);if(d<nd){nd=d;nearest=e;}});if(nearest){const ang=Math.atan2(nearest.y-py,nearest.x-px);const spd2=7;bullets.push({x:px,y:py,vx:Math.cos(ang)*spd2,vy:Math.sin(ang)*spd2});lastFire=now;}}
  // spawn enemies
  if(now-lastSpawn>1500&&enemies.length<8){spawnEnemy();lastSpawn=now;}
  // update
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-10||b.x>310||b.y<-10||b.y>310)bullets.splice(i,1);}
  for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];const angle=Math.atan2(py-e.y,px-e.x);e.vx=e.vx*0.97+Math.cos(angle)*0.05;e.vy=e.vy*0.97+Math.sin(angle)*0.05;e.x+=e.vx*dt;e.y+=e.vy*dt;
  for(let j=bullets.length-1;j>=0;j--){const b=bullets[j];if(Math.hypot(b.x-e.x,b.y-e.y)<12){e.hp--;bullets.splice(j,1);if(e.hp<=0){enemies.splice(i,1);kills++;score+=1500;const se=document.getElementById('mg-score');const ke=document.getElementById('mg-hits');if(se)se.textContent=score;if(ke)ke.textContent=kills;}break;}}}
  // draw
  ctx.fillStyle='#030810';ctx.fillRect(0,0,300,300);
  for(let s=0;s<20;s++){ctx.fillStyle=`rgba(255,255,255,${0.2+Math.sin(s*77)*0.15})`;ctx.beginPath();ctx.arc((s*73+100)%300,(s*53+50)%300,0.8,0,Math.PI*2);ctx.fill();}
  enemies.forEach(e=>{ctx.fillStyle='#ff4757';ctx.save();ctx.translate(e.x,e.y);const ang=Math.atan2(py-e.y,px-e.x);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-8,7);ctx.lineTo(-8,-7);ctx.closePath();ctx.fill();ctx.restore();});
  bullets.forEach(b=>{ctx.fillStyle='#f5a623';ctx.shadowBlur=4;ctx.shadowColor='#f5a623';ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;});
  ctx.fillStyle='#00d2ff';ctx.save();ctx.translate(px,py);const pa=Math.atan2(pvy,pvx||0.001);ctx.rotate(pa);ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,9);ctx.lineTo(-6,0);ctx.lineTo(-10,-9);ctx.closePath();ctx.fill();ctx.restore();
  if(!gameOver)window._mgRAF=requestAnimationFrame(draw);}
  window._mgRAF=requestAnimationFrame(draw);
}

    let resolved=0;
    MID.forEach(md=>{const ms=S.missions[md.id];if(!ms||!ms.active)return;if(Date.now()>=ms.endTime){ms.active=false;ms.progress=0;S.missionsComplete++;resolved++;}});
    if(earned>0||resolved>0){const hrs=Math.floor(elapsed/3600),mins=Math.floor((elapsed%3600)/60);const timeStr=hrs>0?`${hrs}h ${mins}m`:`${mins}m`;showOfflineModal(timeStr,earned,resolved);}
  }catch(e){}
}
function showOfflineModal(time,earned,missions){
  const ov=document.createElement('div');ov.className='omodal';
  ov.innerHTML=`<div class="ombox"><div class="omtitle">DEBRIEFING</div><div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:14px">Welcome Back, Commander</div><div class="omrow"><span class="k">Away for</span><span class="v">${time}</span></div><div class="omrow"><span class="k">Passive Income</span><span class="v">+$${fmtN(earned)}</span></div><div class="omrow"><span class="k">Missions Resolved</span><span class="v">${missions}</span></div><div class="omrow"><span class="k">Max Offline</span><span class="v" style="color:var(--muted)">12 Hours</span></div><button class="btn bg" style="margin-top:14px" onclick="this.closest('.omodal').remove()">Resume Command</button></div>`;
  document.body.appendChild(ov);
}
// ═══ NAV ═══
let curView='scene';
document.querySelectorAll('.nb').forEach(btn=>{
  btn.addEventListener('click',()=>{
    curView=btn.dataset.v;
    document.querySelectorAll('.nb').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+curView).classList.add('active');
    if(curView==='fleet')renderFleet();else if(curView==='missions')renderMissions();
    else if(curView==='upgrades')renderUpgrades();else if(curView==='base')renderBase();
    else if(curView==='war')renderWar();else if(curView==='action')renderAction();
    else if(curView==='scene')resizeSC();
  });
});
// ═══ TOAST ═══
function toast(msg,col='var(--text)'){
  const e=document.createElement('div');e.className='tmsg';e.style.cssText=`border-color:${col}33;color:${col}`;e.textContent=msg;
  const t=document.getElementById('toast');t.appendChild(e);while(t.children.length>4)t.removeChild(t.firstChild);setTimeout(()=>e.remove(),3000);
}
// ═══ UTILS ═══
function fmtN(n){n=Math.floor(n);if(n>=1e15)return(n/1e15).toFixed(2)+'Qa';if(n>=1e12)return(n/1e12).toFixed(2)+'T';if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(2)+'M';if(n>=1e3)return(n/1e3).toFixed(1)+'K';return n.toString();}
function refreshAll(){updateHUD();updateSceneHUD();updatePlanes();checkNavDots();if(curView==='fleet')renderFleet();else if(curView==='missions')renderMissions();else if(curView==='upgrades')renderUpgrades();else if(curView==='base')renderBase();else if(curView==='war')renderWar();else if(curView==='action')renderAction();}
// ═══ INIT ═══
applyOffline();updatePlanes();updateHUD();updateSceneHUD();resizeSC();
if((S.medals||0)>0||S.prestigeStars>=5)document.getElementById('medal-pill').style.display='flex';
checkAchievements();
</script>

if('serviceWorker' in navigator){

    navigator.serviceWorker.register('sw.js',{scope:'./'}).then(function(reg){
      console.log('[IRONSKY] SW registered, scope:',reg.scope);
    }).catch(function(err){
      console.log('[IRONSKY] SW failed:',err);
    });
  });
}
</script>
